        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 25px; margin-bottom: 25px; }
        .filter-row { display: flex; align-items: center; gap: 15px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 5px; }

        select { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(30, 41, 59, 0.8); color: #fff; font-size: 0.85rem; outline: none; cursor: pointer; }
        .btn-group { display: flex; gap: 10px; margin-left: auto; flex-shrink: 0; }
        button { padding: 8px 16px; border: none; border-radius: 8px; color: #fff; font-weight: 600; cursor: pointer; font-size: 0.85rem; white-space: nowrap; display: flex; align-items: center; gap: 6px; transition: 0.3s; }

        .btn-reset { background: linear-gradient(135deg, #64748b, #475569); }
        .btn-print { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .btn-excel { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; border: 1px solid var(--glass-border); text-align: center; }
        .stat-label { font-size: 0.9rem; color: #94a3b8; margin-bottom: 8px; }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: #fff; }
        .welcome-card { text-align: center; padding: 80px 20px; color: #94a3b8; }
        .welcome-card h2 { font-size: 1.8rem; color: #e2e8f0; margin-bottom: 15px; }
        .table-container { overflow-x: auto; border-radius: 12px; border: 1px solid var(--glass-border); }
        table { width: 100%; border-collapse: collapse; background: rgba(15, 23, 42, 0.6); }
        th, td { padding: 14px 15px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.95rem; }
        th { background: rgba(99, 102, 241, 0.2); color: #c7d2fe; font-weight: 600; }
        tr:hover { background: rgba(255,255,255,0.05); }
        tr.total-row { background: rgba(139, 92, 246, 0.15); font-weight: bold; color: #ddd6fe; }
        tr.total-row td { border-top: 2px solid var(--secondary-color); }
        .hidden { display: none !important; }
        .print-only-header { display: none; }

        @media print {
            @page { size: A4 landscape; margin: 10mm; }

            .particles, header, .glass-panel:first-of-type, .stats-row, .btn-group, .welcome-card { display: none !important; }

            .glass-panel { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 !important; backdrop-filter: none !important; margin: 0 !important; }
            .table-container { border: none !important; overflow: visible !important; width: 100% !important; }
            table { background: #fff !important; font-size: 10px !important; width: 100% !important; border-collapse: collapse !important; }
            th, td { border: 1px solid #333 !important; color: #000 !important; padding: 6px 8px !important; word-break: break-all; }

    document.addEventListener('DOMContentLoaded', () => {
        initFilters(); initParticles(); updatePrintDate();
        document.getElementById('yearFilter').addEventListener('change', applyFilters);
        document.getElementById('deptFilter').addEventListener('change', applyFilters);
    });

    function updatePrintDate() {
        const now = new Date();
        document.getElementById('printSubtitle').innerText = `打印时间：${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
    }

    function initFilters() {
        const years = [...new Set(rawData.map(d => d.year))].sort((a,b)=>b-a);
        const deptList = [...new Set(rawData.map(d => d.dept))].sort();
        const yearSelect = document.getElementById('yearFilter');
        const deptSelect = document.getElementById('deptFilter');
        years.forEach(y => { let o = document.createElement('option'); o.value = y; o.textContent = y ; yearSelect.appendChild(o); });
        deptList.forEach(d => { let o = document.createElement('option'); o.value = d; o.textContent = d; deptSelect.appendChild(o); });
    }

    function initParticles() {
        const container = document.getElementById('particles');
        for(let i=0; i<30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.top = Math.random() * 100 + '%';
            p.style.width = p.style.height = Math.random() * 4 + 2 + 'px';
            p.style.animationDelay = Math.random() * 15 + 's';
            p.style.animationDuration = Math.random() * 10 + 10 + 's';
            container.appendChild(p);
        }
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        const welcomeCard = document.getElementById('welcomeCard');
        const tablePanel = document.getElementById('tablePanel');
        tbody.innerHTML = '';
        if (data.length === 0) { welcomeCard.classList.remove('hidden'); tablePanel.classList.add('hidden'); updateStats([]); return; }
        welcomeCard.classList.add('hidden'); tablePanel.classList.remove('hidden');

        let tR = 0, tP = 0, tQ = 0;
        data.forEach(item => {
            const tr = document.createElement('tr');
            const isTotal = item.dept === '合计';
            if (isTotal) tr.className = 'total-row';
            tr.innerHTML = `<td>${item.year}</td><td>${item.dept}</td><td>${item.quantity.toLocaleString('zh-CN')}</td><td>${item.recharge.toLocaleString('zh-CN', {minimumFractionDigits: 2})}</td><td>${item.purchase.toLocaleString('zh-CN', {minimumFractionDigits: 2})}</td><td style="color: #4ade80; font-weight:600;">${item.balance.toLocaleString('zh-CN', {minimumFractionDigits: 2})}</td><td>${item.regionBalance.toLocaleString('zh-CN', {minimumFractionDigits: 2})}</td><td>${item.localBalance.toLocaleString('zh-CN', {minimumFractionDigits: 2})}</td>`;
            tbody.appendChild(tr);
            if (!isTotal) {
                tQ += item.quantity;
                tR += item.recharge;
                tP += item.purchase;
            }
        });
        updateStats(data, tQ, tR, tP);
    }

    function updateStats(data, totalQ, totalR, totalP) {
        document.getElementById('statCount').textContent = data.filter(d => d.dept !== '合计').length;
        document.getElementById('statQuantity').textContent = totalQ.toLocaleString('zh-CN');
        document.getElementById('statRecharge').textContent = '¥' + totalR.toLocaleString('zh-CN', {minimumFractionDigits: 2});
        document.getElementById('statPurchase').textContent = '¥' + totalP.toLocaleString('zh-CN', {minimumFractionDigits: 2});
    }

    function applyFilters() {
        const y = document.getElementById('yearFilter').value;
        const d = document.getElementById('deptFilter').value;
        const filtered = rawData.filter(item => (y === '' || item.year === y) && (d === '' || item.dept === d));
        renderTable(filtered);
    }

    function resetFilters() {
        document.getElementById('yearFilter').value = '';
        document.getElementById('deptFilter').value = '';
        document.getElementById('welcomeCard').classList.remove('hidden');
        document.getElementById('tablePanel').classList.add('hidden');
        updateStats([], 0, 0, 0);
    }

    function handlePrint() {
        const y = document.getElementById('yearFilter').value || '全部';
        const d = document.getElementById('deptFilter').value || '全部';
        const now = new Date();
        document.getElementById('printSubtitle').innerText = `筛选条件：${y}年 | ${d} | 打印时间：${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
        window.print();
    }

    function exportExcel() {
        const y = document.getElementById('yearFilter').value || '全部';
        const d = document.getElementById('deptFilter').value || '全部';
        const filtered = rawData.filter(item => (y === '' || item.year === y) && (d === '' || item.dept === d));
        if(filtered.length === 0) return alert('当前没有数据可以导出');
        
        const wsData = [["年度", "部门名称", "数量", "充值金额", "购书金额", "余额", "全区卡余额", "地区卡余额", "门店卡余额"]];
        filtered.forEach(item => {
            wsData.push([item.year, item.dept, item.quantity, item.recharge, item.purchase, item.balance, item.regionBalance, item.localBalance]);
        });
        
        const ws = XLSX.utils.aoa_to_sheet(wsData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "储值卡汇总");
        XLSX.writeFile(wb, `包头地区储值卡余额情况(${y}_${d}).xlsx`);
    }
</script>
