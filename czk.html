<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>包头地区储值卡余额情况汇总表</title>
    <!-- 仅保留 Excel 导出库 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary-color: #6366f1; --secondary-color: #8b5cf6; --glass-bg: rgba(255,255,255,0.1); --glass-border: rgba(255,255,255,0.2); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: #e2e8f0; min-height: 100vh; }
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .particle { position: absolute; background: rgba(255,255,255,0.15); border-radius: 50%; animation: float 15s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0) translateX(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-100vh) translateX(50px); opacity: 0; } }
        .container { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 30px 20px; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { font-size: 2.2rem; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 25px; margin-bottom: 25px; }
        .filter-row { display: flex; align-items: center; gap: 15px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 5px; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; min-width: 150px; }
        .filter-group label { font-size: 0.8rem; color: #cbd5e1; font-weight: 600; }
        select { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(30, 41, 59, 0.8); color: #fff; font-size: 0.85rem; outline: none; cursor: pointer; }
        .btn-group { display: flex; gap: 10px; margin-left: auto; flex-shrink: 0; }
        button { padding: 8px 16px; border: none; border-radius: 8px; color: #fff; font-weight: 600; cursor: pointer; font-size: 0.85rem; white-space: nowrap; display: flex; align-items: center; gap: 6px; transition: 0.3s; }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .btn-reset { background: linear-gradient(135deg, #64748b, #475569); }
        .btn-print { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .btn-excel { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; border: 1px solid var(--glass-border); text-align: center; }
        .stat-label { font-size: 0.9rem; color: #94a3b8; margin-bottom: 8px; }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: #fff; }
        .welcome-card { text-align: center; padding: 80px 20px; color: #94a3b8; }
        .welcome-card h2 { font-size: 1.8rem; color: #e2e8f0; margin-bottom: 15px; }
        .table-container { overflow-x: auto; border-radius: 12px; border: 1px solid var(--glass-border); }
        table { width: 100%; border-collapse: collapse; background: rgba(15, 23, 42, 0.6); }
        th, td { padding: 14px 15px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.95rem; }
        th { background: rgba(99, 102, 241, 0.2); color: #c7d2fe; font-weight: 600; }
        tr:hover { background: rgba(255,255,255,0.05); }
        tr.total-row { background: rgba(139, 92, 246, 0.15); font-weight: bold; color: #ddd6fe; }
        tr.total-row td { border-top: 2px solid var(--secondary-color); }
        .hidden { display: none !important; }
        .print-only-header { display: none; }

        @media print {
            @page { size: A4 landscape; margin: 10mm; }
            body { background: #fff !important; color: #000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .particles, header, .glass-panel:first-of-type, .stats-row, .btn-group, .welcome-card { display: none !important; }
            .print-only-header { display: block !important; text-align: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #000; }
            .print-only-header h1 { font-size: 22px !important; color: #000 !important; font-weight: bold; margin-bottom: 5px; }
            .print-only-header p { font-size: 12px !important; color: #333 !important; }
            .glass-panel { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 !important; backdrop-filter: none !important; margin: 0 !important; }
            .table-container { border: none !important; overflow: visible !important; width: 100% !important; }
            table { background: #fff !important; font-size: 10px !important; width: 100% !important; border-collapse: collapse !important; }
            th, td { border: 1px solid #333 !important; color: #000 !important; padding: 6px 8px !important; word-break: break-all; }
            th { background: #eee !important; font-weight: bold !important; }
            tr.total-row { background: #f3e8ff !important; color: #000 !important; }
            thead { display: table-header-group !important; }
            tr { page-break-inside: avoid !important; break-inside: avoid !important; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="container">
        <header><h1>包头地区储值卡余额情况汇总表</h1></header>
        <div class="print-only-header" id="printHeader">
            <h1>包头地区储值卡余额情况汇总表</h1>
            <p id="printSubtitle">打印时间：加载中...</p>
        </div>
        <div class="glass-panel">
            <div class="filter-row">
                <div class="filter-group"><label>按年度筛选</label><select id="yearFilter"><option value="">全部年度</option></select></div>
                <div class="filter-group"><label>按部门名称筛选</label><select id="deptFilter"><option value="">全部部门</option></select></div>
                <div class="btn-group">
                    <button class="btn-reset" onclick="resetFilters()">🔄 重置</button>
                    <button class="btn-print" onclick="handlePrint()">🖨️ 打印</button>
                    <button class="btn-excel" onclick="exportExcel()">📊 导出Excel</button>
                </div>
            </div>
        </div>
        <div class="stats-row" id="statsRow">
            <div class="stat-card"><div class="stat-label">筛选记录数</div><div class="stat-value" id="statCount">0</div></div>
            <div class="stat-card"><div class="stat-label">总充值金额</div><div class="stat-value" id="statRecharge">¥0.00</div></div>
            <div class="stat-card"><div class="stat-label">总购书金额</div><div class="stat-value" id="statPurchase">¥0.00</div></div>
            <div class="stat-card"><div class="stat-label">总余额</div><div class="stat-value" id="statBalance">¥0.00</div></div>
        </div>
        <div class="glass-panel welcome-card" id="welcomeCard"><h2>👋 欢迎使用数据查询系统</h2><p>请通过上方的「年度」或「部门」下拉框进行筛选查询</p></div>
        <div class="glass-panel hidden" id="tablePanel">
            <div class="table-container">
                <table id="dataTable">
                    <thead><tr><th>年度</th><th>部门名称</th><th>期初余额</th><th>本期充值</th><th>本期购书</th><th>期末余额</th></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

<script>
    // 动态生成80条模拟数据 (10年 × 8家门店)
    const depts = ["包头书城", "昆区新华书店", "东河新华书店", "青山新华书店", "固阳新华书店", "土右新华书店", "达茂新华书店", "石拐新华书店"];
    const rawData = [];
    for (let y = 2025; y >= 2016; y--) {
        depts.forEach((dept, index) => {
            const base = 25000 - (index * 3000) - ((2025 - y) * 1000);
            const recharge = base * 3;
            const purchase = recharge * 0.95;
            const end = base + recharge - purchase;
            rawData.push({
                year: String(y), dept: dept,
                begin: Math.max(base, 1000), recharge: Math.max(recharge, 5000),
                purchase: Math.max(purchase, 4000), end: Math.max(end, 1000)
            });
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        initFilters(); initParticles(); updatePrintDate();
        document.getElementById('yearFilter').addEventListener('change', applyFilters);
        document.getElementById('deptFilter').addEventListener('change', applyFilters);
    });

    function updatePrintDate() {
        const now = new Date();
        document.getElementById('printSubtitle').innerText = `打印时间：${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
    }

    function initFilters() {
        const years = [...new Set(rawData.map(d => d.year))].sort((a,b)=>b-a);
        const deptList = [...new Set(rawData.map(d => d.dept))].sort();
        const yearSelect = document.getElementById('yearFilter');
        const deptSelect = document.getElementById('deptFilter');
        years.forEach(y => { let o = document.createElement('option'); o.value = y; o.textContent = y + '年'; yearSelect.appendChild(o); });
        deptList.forEach(d => { let o = document.createElement('option'); o.value = d; o.textContent = d; deptSelect.appendChild(o); });
    }

    function initParticles() {
        const container = document.getElementById('particles');
        for(let i=0; i<30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.top = Math.random() * 100 + '%';
            p.style.width = p.style.height = Math.random() * 4 + 2 + 'px';
            p.style.animationDelay = Math.random() * 15 + 's';
            p.style.animationDuration = Math.random() * 10 + 10 + 's';
            container.appendChild(p);
        }
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        const welcomeCard = document.getElementById('welcomeCard');
        const tablePanel = document.getElementById('tablePanel');
        tbody.innerHTML = '';
        if (data.length === 0) { welcomeCard.classList.remove('hidden'); tablePanel.classList.add('hidden'); updateStats([]); return; }
        welcomeCard.classList.add('hidden'); tablePanel.classList.remove('hidden');

        let tR = 0, tP = 0, tE = 0;
        data.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${item.year}</td><td>${item.dept}</td><td>${item.begin.toLocaleString('zh-CN', {minimumFractionDigits: 2})}</td><td>${item.recharge.toLocaleString('zh-CN', {minimumFractionDigits: 2})}</td><td>${item.purchase.toLocaleString('zh-CN', {minimumFractionDigits: 2})}</td><td style="color: #4ade80; font-weight:600;">${item.end.toLocaleString('zh-CN', {minimumFractionDigits: 2})}</td>`;
            tbody.appendChild(tr);
            tR += item.recharge; tP += item.purchase; tE += item.end;
        });

        const totalTr = document.createElement('tr');
        totalTr.className = 'total-row';
        totalTr.innerHTML = `<td colspan="2">合 计</td><td>-</td><td>${tR.toLocaleString('zh-CN', {minimumFractionDigits: 2})}</td><td>${tP.toLocaleString('zh-CN', {minimumFractionDigits: 2})}</td><td style="color: #c084fc;">${tE.toLocaleString('zh-CN', {minimumFractionDigits: 2})}</td>`;
        tbody.appendChild(totalTr);
        updateStats(data);
    }

    function updateStats(data) {
        document.getElementById('statCount').textContent = data.length;
        const sumR = data.reduce((a,b) => a + b.recharge, 0);
        const sumP = data.reduce((a,b) => a + b.purchase, 0);
        const sumE = data.reduce((a,b) => a + b.end, 0);
        document.getElementById('statRecharge').textContent = '¥' + sumR.toLocaleString('zh-CN', {minimumFractionDigits: 2});
        document.getElementById('statPurchase').textContent = '¥' + sumP.toLocaleString('zh-CN', {minimumFractionDigits: 2});
        document.getElementById('statBalance').textContent = '¥' + sumE.toLocaleString('zh-CN', {minimumFractionDigits: 2});
    }

    function applyFilters() {
        const y = document.getElementById('yearFilter').value;
        const d = document.getElementById('deptFilter').value;
        const filtered = rawData.filter(item => (y === '' || item.year === y) && (d === '' || item.dept === d));
        renderTable(filtered);
    }

    function resetFilters() {
        document.getElementById('yearFilter').value = '';
        document.getElementById('deptFilter').value = '';
        document.getElementById('welcomeCard').classList.remove('hidden');
        document.getElementById('tablePanel').classList.add('hidden');
        updateStats([]);
    }

    function handlePrint() {
        const y = document.getElementById('yearFilter').value || '全部';
        const d = document.getElementById('deptFilter').value || '全部';
        const now = new Date();
        document.getElementById('printSubtitle').innerText = `筛选条件：${y}年 | ${d} | 打印时间：${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
        window.print();
    }

    function exportExcel() {
        const y = document.getElementById('yearFilter').value || '全部';
        const d = document.getElementById('deptFilter').value || '全部';
        const filtered = rawData.filter(item => (y === '' || item.year === y) && (d === '' || item.dept === d));
        if(filtered.length === 0) return alert('当前没有数据可以导出');
        
        const wsData = [["年度", "部门名称", "期初余额", "本期充值", "本期购书", "期末余额"]];
        let tR=0, tP=0, tE=0;
        filtered.forEach(item => {
            wsData.push([item.year, item.dept, item.begin, item.recharge, item.purchase, item.end]);
            tR += item.recharge; tP += item.purchase; tE += item.end;
        });
        wsData.push(["合计", "", "", tR, tP, tE]);
        
        const ws = XLSX.utils.aoa_to_sheet(wsData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "储值卡汇总");
        XLSX.writeFile(wb, `包头地区储值卡余额情况(${y}年_${d}).xlsx`);
    }
</script>
</body>
</html>
