                    transposeBtn.innerHTML = '<i class="fas fa-exchange-alt mr-1"></i>转置';
                    transposeBtn.classList.remove('bg-purple-500', 'hover:bg-purple-600');
                    transposeBtn.classList.add('bg-indigo-500', 'hover:bg-indigo-600');
                }
                
                // 更新全部按钮文本
                const allBtn = document.querySelector('[data-subject=""]');
                if (allBtn) {
                    if (this.isTransposed) {
                        allBtn.innerHTML = '<i class="fas fa-school mr-2 w-5 text-center text-blue-500"></i>全部学校';
                    } else {
                        allBtn.innerHTML = '<i class="fas fa-book mr-2 w-5 text-center text-blue-500"></i>全部科目';
                    }
                }
                
                // 更新表头
                this.updateTableHeaders();
                
                // 重新渲染表格
                this.renderTable();
                
                // 确保表头和表体列宽同步
                setTimeout(() => {
                    this.syncColumnWidths();
                    // 重新设置同步滚动
                    this.setupSyncScroll();
                }, 200);
                
                // 更新学校筛选列表
                this.updateSchoolFilters();
                
                // 显示状态提示
                this.showNotification(this.isTransposed ? '已转置表格' : '已恢复表格', 'info');
            }
            
            // 销毁应用实例，清理资源
            destroy() {
                this.cleanupEventListeners();
                DataCache.clear();
            }
            
            // 同步表头和表体的列宽
            syncColumnWidths() {
                try {
                    const headerCells = this.elements.tableHeader.querySelectorAll('th');
                    const bodyRows = this.elements.tableBody.querySelectorAll('tr');
                    
                    if (bodyRows.length === 0) return;
                    
                    const firstBodyRow = bodyRows[0];
                    const bodyCells = firstBodyRow.querySelectorAll('td');
                    
                    // 确保表头和表体的列数一致
                    if (headerCells.length !== bodyCells.length) {
                        console.warn('表头和表体列数不一致，无法同步列宽');
                        return;
                    }
                    
                    // 同步每一列的宽度
                    headerCells.forEach((headerCell, index) => {
                        if (bodyCells[index]) {
                            // 获取表头单元格的实际宽度
                            const headerWidth = headerCell.offsetWidth;
                            
                            // 设置表体单元格的宽度
                            bodyCells[index].style.width = headerWidth + 'px';
                            bodyCells[index].style.minWidth = headerWidth + 'px';
                            bodyCells[index].style.maxWidth = headerWidth + 'px';
                            
                            // 同时设置其他行的相同列
                            for (let i = 1; i < bodyRows.length; i++) {
                                const rowCells = bodyRows[i].querySelectorAll('td');
                                if (rowCells[index]) {
                                    rowCells[index].style.width = headerWidth + 'px';
                                    rowCells[index].style.minWidth = headerWidth + 'px';
                                    rowCells[index].style.maxWidth = headerWidth + 'px';
                                }
                            }
                        }
                    });
                    
                    // 触发重排以确保宽度生效
                    void this.elements.tableBody.offsetWidth;
                } catch (error) {
                    console.error('Error syncing column widths:', error);
                }
            }
        }

        // 当DOM加载完成后初始化应用
        document.addEventListener('DOMContentLoaded', () => {
            // 初始化应用
            window.app = new BookManagementApp();
            
            // 初始化轮播图
            initCarousel();
            
            // 调整侧边栏和主内容区高度一致
            adjustSidebarHeight();
            
            // 窗口大小改变时重新调整高度
            window.addEventListener('resize', Utils.debounce(adjustSidebarHeight, 200));
        });
        
        // 调整侧边栏和主内容区高度一致
        function adjustSidebarHeight() {
            const sidebarContainer = document.querySelector('.sidebar-container');
            const mainContent = document.querySelector('.main-content');
            
            if (sidebarContainer && mainContent) {
                // 获取主内容区的高度
                const mainContentHeight = mainContent.offsetHeight;
                
                // 设置侧边栏高度与主内容区一致
                sidebarContainer.style.height = `${mainContentHeight}px`;
                
                // 调整学校筛选区域的最大高度
                const schoolFilterContainer = document.getElementById('schoolFilterContainer');
                if (schoolFilterContainer) {
                    // 计算学校筛选区域的最大高度（减去标题和统计信息的高度）
                    const headerHeight = document.querySelector('.sidebar-container h2').offsetHeight;
                    const statsHeight = document.querySelector('.sidebar-container .mt-4').offsetHeight;
                    const padding = 32; // 考虑内边距
                    
                    const maxFilterHeight = mainContentHeight - headerHeight - statsHeight - padding;
                    schoolFilterContainer.style.maxHeight = `${maxFilterHeight}px`;
                }
            }
        }
        
        // 轮播图功能
        let currentSlide = 0;
        let slideInterval;
        const slides = document.querySelectorAll('.carousel-slide');
        const totalSlides = slides.length;
        
        // 初始化轮播图
        function initCarousel() {
            // 显示第一张幻灯片
            showSlide(0);
            
            // 开始自动轮播
            startAutoSlide();
        }
        
        // 显示指定幻灯片
        function showSlide(index) {
            // 确保索引在有效范围内
            currentSlide = (index + totalSlides) % totalSlides;
            
            // 更新幻灯片显示
            slides.forEach((slide, i) => {
                slide.classList.toggle('active', i === currentSlide);
            });
        }
        
        // 切换到上一张/下一张幻灯片
        function changeSlide(direction) {
            // 清除当前的自动轮播计时器
            clearInterval(slideInterval);
            
            // 显示目标幻灯片
            showSlide(currentSlide + direction);
            
            // 重新开始自动轮播
            startAutoSlide();
        }
        
        // 直接跳转到指定幻灯片
        function goToSlide(index) {
            // 清除当前的自动轮播计时器
            clearInterval(slideInterval);
            
            // 显示目标幻灯片
            showSlide(index);
            
            // 重新开始自动轮播
            startAutoSlide();
        }
        
        // 开始自动轮播
        function startAutoSlide() {
            // 每5秒切换一次幻灯片
            slideInterval = setInterval(() => {
                changeSlide(1);
            }, 5000);
        }

        // 处理文件上传
        function handleFileUpload(event) {
            console.log('文件上传处理函数被调用');
            const file = event.target.files[0];
            if (!file) {
                console.log('未选择文件');
                return;
            }
            
            console.log('选择的文件:', file.name);
            
            // 验证文件类型和大小
            if (!validateFile(file)) {
                console.log('文件验证失败');
                return;
            }
            
            console.log('文件验证通过');
            
            // 保存文件引用，用于后续处理
            window.currentImportFile = file;
            
            // 重置文件输入
            event.target.value = '';
            
            // 显示密码输入模态框
            console.log('准备显示密码模态框');
            showPasswordModal();
        }
        
        // 验证文件类型和大小
        function validateFile(file) {
            // 检查文件类型
            const fileExtension = file.name.split('.').pop().toLowerCase();
            if (!APP_CONSTANTS.EXCEL_EXTENSIONS.includes(`.${fileExtension}`)) {
                window.app.showNotification('请上传.xls或.xlsx格式的Excel文件', 'error');
                return false;
            }
            
            // 检查文件大小
            if (file.size > APP_CONSTANTS.MAX_FILE_SIZE) {
                window.app.showNotification('文件大小不能超过50MB', 'error');
                return false;
            }
            
            return true;
        }
        
        // 处理文件导入
        function processFile(file) {
            // 如果正在导入，先取消之前的导入
            if (window.app.isImporting) {
                window.app.cancelImport();
            }
            
            // 显示加载状态
            window.app.showLoading('正在读取Excel文件...');
            
            // 直接在主线程处理Excel文件
            try {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    try {
                        // 解析Excel文件
                        const data = new Uint8Array(e.target.result);
                        
                        // 修复：使用正确的配置解析.xls文件
                        const workbook = XLSX.read(data, { 
                            type: 'array',
                            cellDates: true,
                            cellNF: false,
                            cellText: false,
                            raw: false,
                            bookVBA: false,
                            bookSheets: false,
                            bookProps: false
                        });
                        
                        // 获取第一个工作表
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        
                        // 转换为JSON，保留原始表头
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { 
                            header: 1, // 保留原始表头
                            defval: '', // 空单元格使用空字符串
                            range: 0 // 从第一行开始
                        });
                        
                        console.log('解析到的Excel数据:', jsonData);
                        console.log('数据行数:', jsonData.length);
                        
                        // 检查数据是否为空
                        if (jsonData.length <= 1) {
                            throw new Error('Excel文件中没有找到数据');
                        }
                        
                        // 提取表头和数据
                        const headers = jsonData[0];
                        console.log('表头:', headers);
                        
                        // 检查是否至少有2列（教材科目、至少一个学校）
                        if (!headers || headers.length < 2) {
                            throw new Error('Excel文件格式不正确，至少需要包含教材科目和一个学校列');
                        }
                        
                        // 固定第一列为教材科目
                        const subjectHeader = headers[0];
                        console.log('科目表头:', subjectHeader);
                        
                        // 后面的列全部为学校名称
                        const schoolHeaders = headers.slice(1);
                        console.log('学校表头数量:', schoolHeaders.length);
                        
                        // 检查是否有学校列
                        if (schoolHeaders.length === 0) {
                            throw new Error('Excel文件中没有找到学校列，请确保前两列之后有学校数据');
                        }
                        
                        // 转换为对象数组
                        const dataObjects = [];
                        for (let i = 1; i < jsonData.length; i++) {
                            const row = jsonData[i];
                            
                            // 跳过空行
                            let isEmptyRow = true;
                            for (let j = 0; j < row.length; j++) {
                                if (row[j] !== undefined && row[j] !== null && row[j] !== '') {
                                    isEmptyRow = false;
                                    break;
                                }
                            }
                            
                            if (isEmptyRow) {
                                continue;
                            }
                            
                            const obj = {
                                subject: row[0] || ''
                            };
                            
                            // 添加学校数据
                            for (let j = 1; j < headers.length; j++) {
                                const school = headers[j];
                                obj[school] = row[j];
                            }
                            
                            dataObjects.push(obj);
                        }
                        
                        // 检查是否有有效数据
                        if (dataObjects.length === 0) {
                            throw new Error('Excel文件中没有找到有效数据');
                        }
                        
                        // 保存学校表头和原始表头
                        window.app.originalHeaders = headers; // 保存完整的原始表头
                        window.app.schoolHeaders = schoolHeaders; // 保存学校表头
                        
                        console.log('准备导入数据，数据对象数量:', dataObjects.length);
                        
                        // 导入数据 - importFromExcel 内部会处理加载状态和后续操作
                        window.app.importFromExcel(dataObjects);
                        
                    } catch (error) {
                        handleImportError('处理文件失败: ' + error.message);
                    }
                };
                
                reader.onerror = function() {
                    handleImportError('读取文件失败');
                };
                
                // 读取文件
                reader.readAsArrayBuffer(file);
                
            } catch (error) {
                handleImportError('初始化导入失败: ' + error.message);
            }
        }
        
        // 处理导入错误
        function handleImportError(errorMessage) {
            window.app.hideLoading();
            window.app.showNotification(errorMessage, 'error');
            window.app.isImporting = false;
        }
        
        // 显示密码输入模态框
        function showPasswordModal() {
            console.log('显示密码模态框函数被调用');
            
            // 获取模态框元素
            const passwordModal = document.getElementById('passwordModal');
            const passwordInput = document.getElementById('passwordInput');
            const passwordError = document.getElementById('passwordError');
            const confirmPasswordBtn = document.getElementById('confirmPasswordBtn');
            const cancelPasswordBtn = document.getElementById('cancelPasswordBtn');
            
            console.log('模态框元素:', {
                passwordModal: !!passwordModal,
                passwordInput: !!passwordInput,
                passwordError: !!passwordError,
                confirmPasswordBtn: !!confirmPasswordBtn,
                cancelPasswordBtn: !!cancelPasswordBtn
            });
            
            if (!passwordModal) {
                console.error('未找到密码模态框元素');
                return;
            }
            
            // 重置输入和错误状态
            passwordInput.value = '';
            passwordError.classList.add('hidden');
            passwordInput.focus();
            
            // 显示模态框
            console.log('显示密码模态框');
            passwordModal.classList.remove('hidden');
            
            // 确认按钮点击事件
            const handleConfirm = function() {
                const password = passwordInput.value.trim();
                console.log('输入的密码:', password);
                console.log('正确密码:', APP_CONSTANTS.IMPORT_PASSWORD);
                console.log('密码匹配:', password === APP_CONSTANTS.IMPORT_PASSWORD);
                
                // 验证密码
                if (password === APP_CONSTANTS.IMPORT_PASSWORD) {
                    // 密码正确，隐藏模态框并处理文件
                    passwordModal.classList.add('hidden');
                    console.log('密码正确，开始处理文件');
                    processFile(window.currentImportFile);
                    
                    // 移除事件监听器
                    confirmPasswordBtn.removeEventListener('click', handleConfirm);
                    cancelPasswordBtn.removeEventListener('click', handleCancel);
                } else {
                    // 密码错误，显示错误信息
                    console.log('密码错误');
                    passwordError.classList.remove('hidden');
                    passwordInput.select();
                }
            };
            
            // 取消按钮点击事件
            const handleCancel = function() {
                // 隐藏模态框，取消导入
                passwordModal.classList.add('hidden');
                
                // 移除事件监听器
                confirmPasswordBtn.removeEventListener('click', handleConfirm);
                cancelPasswordBtn.removeEventListener('click', handleCancel);
            };
            
            // 添加事件监听器
            confirmPasswordBtn.addEventListener('click', handleConfirm);
            cancelPasswordBtn.addEventListener('click', handleCancel);
            
            // 回车键事件
            passwordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    handleConfirm();
                }
            });
        }
        
        // 页面卸载时清理资源
        window.addEventListener('beforeunload', () => {
            if (window.app) {
                window.app.destroy();
            }
        });
    </script>
