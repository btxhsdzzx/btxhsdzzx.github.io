                // 分页状态
                this.currentPage = 1;
                this.itemsPerPage = APP_CONSTANTS.DEFAULT_PAGE_SIZE;
                this.currentSearchTerm = '';
                this.currentSchoolFilter = ''; // 当前选中的学校筛选
                this.currentSubjectFilter = ''; // 当前选中的科目筛选
                
                // 导入状态
                this.importAbortController = null;
                this.isImporting = false;
                
                // DOM 元素缓存
                this.elements = {
                    tableBody: document.getElementById('tableBody'),
                    searchInput: document.getElementById('searchInput'),
                    prevPageBtn: document.getElementById('prevPageBtn'),
                    nextPageBtn: document.getElementById('nextPageBtn'),
                    pageSizeSelect: document.getElementById('pageSize'),
                    exportExcelBtn: document.getElementById('exportExcelBtn'),
                    printBtn: document.getElementById('printBtn'),
                    loadingOverlay: document.getElementById('loadingOverlay'),
                    loadingText: document.getElementById('loadingText'),
                    schoolFilterContainer: document.getElementById('schoolFilterContainer'),
                    progressBar: document.getElementById('progressBar'),
                    progressText: document.getElementById('progressText'),
                    cancelImportBtn: document.getElementById('cancelImportBtn'),
                    totalVarietyElement: document.getElementById('totalOrders'),
                    totalCopiesElement: document.getElementById('totalCopies'),
                    totalVarietyCopiesElement: document.getElementById('totalVarietyCopies'),
                    totalCopiesLabel: document.getElementById('totalCopiesLabel'),
                    totalVarietyCopiesLabel: document.getElementById('totalVarietyCopiesLabel'),
                    currentRangeElement: document.getElementById('currentRange'),
                    totalRecordsElement: document.getElementById('totalRecords'),
                    currentPageElement: document.getElementById('currentPage'),
                    totalPagesElement: document.getElementById('totalPages'),
                    tableHeader: document.getElementById('tableHeader'),
                    importSuccessModal: document.getElementById('importSuccessModal'),
                    importSuccessMessage: document.getElementById('importSuccessMessage'),
                    closeSuccessModalBtn: document.getElementById('closeSuccessModalBtn'),
                    dataTable: document.getElementById('dataTable'),
                    tableHeaderContainer: document.getElementById('tableHeaderContainer'),
                    tableBodyContainer: document.getElementById('tableBodyContainer')
                };
                
                // 转置状态
                this.isTransposed = false;
                
                // 事件监听器存储，用于清理
                this.eventListeners = new Map();
                
                // 表格渲染状态
                this.isRendering = false;
                this.lastRenderedData = null;
                
                // 初始化应用
                this.initialize();
            }
            
            // 初始化应用
            initialize() {
                this.updateTime();
                this.setupEventListeners();
                
                // 设置同步滚动
                this.setupSyncScroll();
                
                // 每秒更新一次时间
                setInterval(() => this.updateTime(), 1000);
            }
            
            // 更新当前时间
            updateTime() {
                const timeElement = document.getElementById('currentTime');
                if (timeElement) {
                    timeElement.textContent = Utils.getCurrentTimeString();
                }
            }
            
            // 设置事件监听器
            setupEventListeners() {
                // 搜索功能
                this.addEventListener(this.elements.searchInput, 'input', 
                    Utils.debounce(() => this.performSearch(), APP_CONSTANTS.DEBOUNCE_DELAY));
                
                // 分页功能
                this.addEventListener(this.elements.prevPageBtn, 'click', () => this.previousPage());
                this.addEventListener(this.elements.nextPageBtn, 'click', () => this.nextPage());
                this.addEventListener(this.elements.pageSizeSelect, 'change', () => this.changePageSize());
                
                // 导出和打印
                this.addEventListener(this.elements.exportExcelBtn, 'click', () => this.exportToExcel());
                this.addEventListener(this.elements.printBtn, 'click', () => this.printOptimized());
                
                // 转置功能
                this.addEventListener(document.getElementById('transposeBtn'), 'click', () => this.toggleTranspose());
                
                // 取消导入按钮
                this.addEventListener(this.elements.cancelImportBtn, 'click', () => this.cancelImport());
                
                // 全部科目/学校筛选按钮
                this.addEventListener(document.querySelector('[data-subject=""]'), 'click', () => {
                    if (this.isTransposed) {
                        // 转置模式下显示所有学校
                        this.filterBySchool('');
                    } else {
                        // 正常模式下显示所有科目
                        this.filterBySubject('');
                    }
                    
                    // 更新侧边栏激活状态
                    document.querySelectorAll('.sidebar-item').forEach(item => {
                        item.classList.remove('active');
                    });
                    document.querySelector('[data-subject=""]').classList.add('active');
                });
                
                // 导入成功模态框
                this.addEventListener(this.elements.closeSuccessModalBtn, 'click', () => {
                    this.elements.importSuccessModal.classList.add('hidden');
                });
                
                // 表格容器大小变化监听
                this.addEventListener(window, 'resize', 
                    Utils.debounce(() => this.handleContainerResize(), 200));
            }
            
            // 处理容器大小变化
            handleContainerResize() {
                // 如果有数据，重新渲染表格以适应新的容器大小
                if (this.filteredData.length > 0) {
                    this.renderTable();
                }
            }
            
            // 添加事件监听器并存储引用以便后续清理
            addEventListener(element, event, handler) {
                if (!element) return;
                
                const handlerId = Utils.generateId();
                const wrappedHandler = (...args) => {
                    try {
                        handler.apply(this, args);
                    } catch (error) {
                        console.error(`Error in event handler for ${event}:`, error);
                    }
                };
                
                element.addEventListener(event, wrappedHandler);
                
                if (!this.eventListeners.has(element)) {
                    this.eventListeners.set(element, []);
                }
                
                this.eventListeners.get(element).push({
                    id: handlerId,
                    event,
                    handler: wrappedHandler
                });
                
                return handlerId;
            }
            
            // 移除事件监听器
            removeEventListener(element, event, handlerId) {
                if (!element || !this.eventListeners.has(element)) return;
                
                const listeners = this.eventListeners.get(element);
                const index = listeners.findIndex(l => l.id === handlerId && l.event === event);
                
                if (index !== -1) {
                    const { handler } = listeners[index];
                    element.removeEventListener(event, handler);
                    listeners.splice(index, 1);
                }
            }
            
            // 清理所有事件监听器
            cleanupEventListeners() {
                for (const [element, listeners] of this.eventListeners) {
                    for (const { event, handler } of listeners) {
                        element.removeEventListener(event, handler);
                    }
                }
                this.eventListeners.clear();
            }
            
            // 渲染表格
            renderTable() {
                PerformanceMonitor.start('renderTable');
                
                // 防止重复渲染
                if (this.isRendering) {
                    PerformanceMonitor.end('renderTable');
                    return;
                }
                
                this.isRendering = true;
                
                try {
                    if (this.filteredData.length === 0) {
                        this.renderEmptyState();
                        this.updatePaginationInfo();
                        this.isRendering = false;
                        PerformanceMonitor.end('renderTable');
                        return;
                    }
                    
                    // 强制更新表头，确保与数据严格对应
                    this.updateTableHeaders();
                    
                    // 等待表头更新完成后再渲染数据
                    setTimeout(() => {
                        try {
                            // 渲染表格内容
                            if (this.isTransposed) {
                                // 转置模式：按学校显示行
                                this.renderTransposedTable();
                            } else {
                                // 正常模式：按教材科目显示行
                                this.renderNormalTable();
                            }
                            
                            // 更新分页信息
                            this.updatePaginationInfo();
                            
                            // 记录渲染的数据引用
                            this.lastRenderedData = this.filteredData;
                            
                            // 同步左右模块高度
                            this.syncModuleHeights();
                            
                        } catch (error) {
                            console.error('Error in table rendering timeout:', error);
                        } finally {
                            this.isRendering = false;
                            PerformanceMonitor.end('renderTable');
                        }
                    }, 100);
                    
                } catch (error) {
                    console.error('Error rendering table:', error);
                    this.isRendering = false;
                    PerformanceMonitor.end('renderTable');
                }
            }
            
            // 渲染正常模式表格
            renderNormalTable() {
                // 使用DocumentFragment批量添加行，减少DOM操作
                const fragment = document.createDocumentFragment();
                
                // 计算当前页要显示的数据范围
                const startIndex = (this.currentPage - 1) * this.itemsPerPage;
                const endIndex = Math.min(startIndex + this.itemsPerPage, this.filteredData.length);
                const currentPageData = this.filteredData.slice(startIndex, endIndex);
                
                // 渲染当前页的数据行
                currentPageData.forEach((item, index) => {
                    const actualIndex = startIndex + index; // 实际数据索引
                    const row = this.createTableRow(item, actualIndex);
                    fragment.appendChild(row);
                });
                
                // 添加小计行（每页都显示）
                const subtotalRow = this.createSubtotalRow(currentPageData);
                if (subtotalRow) {
                    fragment.appendChild(subtotalRow);
                }
                
                // 计算是否是最后一页
                const totalPages = Math.ceil(this.filteredData.length / this.itemsPerPage);
                const isLastPage = this.currentPage === totalPages;
                
                // 只在最后一页添加合计行
                if (isLastPage) {
                    const totalRow = this.createTotalRow();
                    if (totalRow) {
                        fragment.appendChild(totalRow);
                    }
                }
                
                // 一次性替换表格内容
                this.elements.tableBody.innerHTML = '';
                this.elements.tableBody.appendChild(fragment);
            }
            
            // 渲染转置模式表格
            renderTransposedTable() {
                // 使用DocumentFragment批量添加行，减少DOM操作
                const fragment = document.createDocumentFragment();
                
                // 确保使用与导出功能相同的数据源
                const dataToUse = this.filteredData.length > 0 ? this.filteredData : this.bookData;
                
                // 获取所有唯一的教材科目
                const subjects = [...new Set(dataToUse.map(item => item.subject).filter(subject => subject))];
                
                // 按学校分组数据
                const schoolData = {};
                
                // 确定要处理的学校列表（考虑搜索结果和筛选条件）
                // 与导出功能保持完全一致的逻辑
                const schoolsToProcess = this._matchingSchools && this._matchingSchools.length > 0 ? this._matchingSchools : 
                                       (this.currentSchoolFilter ? [this.currentSchoolFilter] : this.schoolHeaders);
                
                // 初始化学校数据
                schoolsToProcess.forEach(school => {
                    schoolData[school] = {
                        subjects: {},
                        total: 0 // 学校总册数
                    };
                });
                
                // 填充数据并计算学校总册数
                // 与导出功能保持完全一致的逻辑
                schoolsToProcess.forEach(school => {
                    subjects.forEach(subject => {
                        const item = dataToUse.find(i => i.subject === subject);
                        const value = item ? item[school] || '' : '';
                        schoolData[school].subjects[subject] = value;
                        
                        // 累加学校总册数
                        const numValue = Utils.parseNumber(value);
                        if (!isNaN(numValue)) {
                            schoolData[school].total += numValue;
                        }
                    });
                });
                
                // 计算当前页要显示的数据范围
                const startIndex = (this.currentPage - 1) * this.itemsPerPage;
                const endIndex = Math.min(startIndex + this.itemsPerPage, schoolsToProcess.length);
                const currentPageSchools = schoolsToProcess.slice(startIndex, endIndex);
                
                // 渲染每行（按学校）
                let index = 0;
                
                // 检查是否有学校需要渲染
                if (currentPageSchools.length === 0) {
                    // 如果没有学校需要渲染，显示空状态
                    const emptyRow = document.createElement('tr');
                    const colSpan = 1 + subjects.length + 1; // 学校列 + 科目列 + 合计列
                    emptyRow.innerHTML = `
                        <td colspan="${colSpan}" class="py-4 px-3 text-center border border-gray-300 text-gray-500 text-sm bg-gray-50">
                            暂无符合条件的数据
                        </td>
                    `;
                    fragment.appendChild(emptyRow);
                } else {
                    // 渲染当前页的学校数据行
                    currentPageSchools.forEach(school => {
                        const actualIndex = startIndex + index; // 实际数据索引
                        const row = this.createTransposedTableRow(school, schoolData[school], subjects, actualIndex);
                        fragment.appendChild(row);
                        index++;
                    });
                    
                    // 添加小计行（每页都显示）
                    const subtotalRow = this.createTransposedSubtotalRow(subjects, currentPageSchools, schoolData);
                    if (subtotalRow) {
                        fragment.appendChild(subtotalRow);
                    }
                    
                    // 计算是否是最后一页
                    const totalPages = Math.ceil(schoolsToProcess.length / this.itemsPerPage);
                    const isLastPage = this.currentPage === totalPages;
                    
                    // 只在最后一页添加合计行
                    if (isLastPage) {
                        const totalRow = this.createTransposedTotalRow(subjects, schoolsToProcess, schoolData);
                        if (totalRow) {
                            fragment.appendChild(totalRow);
                        }
                    }
                }
                
                // 一次性替换表格内容
                this.elements.tableBody.innerHTML = '';
                this.elements.tableBody.appendChild(fragment);
            }
            
            // 创建表格行 - 最终优化版本，确保与表头完全对齐
            createTableRow(item, index) {
                const row = document.createElement('tr');
                // 根据索引设置交替背景色
                const rowClass = index % 2 === 0 
                    ? 'compact-row fade-in hover:bg-blue-50 transition-colors' 
                    : 'compact-row fade-in hover:bg-blue-50 transition-colors bg-blue-50';
                row.className = rowClass;
                
                // 添加教材科目列 - 添加固定列样式
                const subjectCell = document.createElement('td');
                subjectCell.className = 'py-1 px-2 border border-gray-300 text-xs auto-font-size tooltip-cell column-width-fixed sticky-first-column';
                const subjectText = item.subject || '';
                subjectCell.textContent = subjectText;
                subjectCell.setAttribute('data-tooltip', subjectText);
                subjectCell.setAttribute('data-header-type', 'subject'); // 添加数据属性标识
                subjectCell.style.width = '96px'; // 固定宽度（六个汉字）
                subjectCell.style.minWidth = '96px'; // 最小宽度（六个汉字）
                subjectCell.style.maxWidth = '96px'; // 最大宽度（六个汉字）
                this.adjustFontSize(subjectCell, subjectText);
                row.appendChild(subjectCell);
                
                // 计算单品总册数（该行所有学校的合计）
                let varietyTotal = 0;
                
                // 添加学校列 - 严格按照表头顺序和索引创建
                this.schoolHeaders.forEach((school, columnIndex) => {
                    const cell = document.createElement('td');
                    cell.className = 'py-1 px-2 border border-gray-300 text-xs text-right';
                    cell.setAttribute('data-school', school); // 添加数据属性用于匹配
                    cell.setAttribute('data-index', columnIndex); // 添加索引用于严格对应
                    cell.style.width = '96px'; // 固定宽度（六个汉字）
                    cell.style.minWidth = '96px'; // 最小宽度（六个汉字）
                    cell.style.maxWidth = '96px'; // 最大宽度（六个汉字）
                    
                    // 获取学校对应的值
                    const value = item[school];
                    
                    // 如果值为空、null、undefined或0，添加灰色背景样式
                    if (value === '' || value === null || value === undefined || value === 0) {
                        cell.classList.add('empty-value-cell');
                        cell.textContent = '';
                    } else {
                        // 尝试将值转换为数字并格式化
                        const numValue = Utils.parseNumber(value);
                        if (!isNaN(numValue)) {
                            const formattedValue = Utils.formatNumber(numValue);
                            cell.textContent = formattedValue;
                            cell.setAttribute('data-tooltip', formattedValue);
                            this.adjustFontSize(cell, formattedValue);
                            varietyTotal += numValue; // 累加单品总册数
                        } else {
                            cell.textContent = String(value);
                            cell.setAttribute('data-tooltip', String(value));
                            this.adjustFontSize(cell, String(value));
                        }
                    }
                    
                    row.appendChild(cell);
                });
                
                // 添加单品总册数列
                const varietyTotalCell = document.createElement('td');
                varietyTotalCell.className = 'py-1 px-2 border border-gray-300 text-xs text-right font-medium bg-blue-50 auto-font-size tooltip-cell';
                varietyTotalCell.setAttribute('data-total', 'variety'); // 添加数据属性标识
                varietyTotalCell.style.width = '96px'; // 固定宽度（六个汉字）
                varietyTotalCell.style.minWidth = '96px'; // 最小宽度（六个汉字）
                varietyTotalCell.style.maxWidth = '96px'; // 最大宽度（六个汉字）
                const varietyTotalText = Utils.formatNumber(varietyTotal);
                varietyTotalCell.textContent = varietyTotalText;
                varietyTotalCell.setAttribute('data-tooltip', varietyTotalText);
                this.adjustFontSize(varietyTotalCell, varietyTotalText);
                row.appendChild(varietyTotalCell);
                
                return row;
            }
            
            // 创建转置模式表格行
            createTransposedTableRow(school, schoolData, subjects, index) {
                const row = document.createElement('tr');
                const rowClass = index % 2 === 0 
                    ? 'compact-row fade-in hover:bg-blue-50 transition-colors' 
                    : 'compact-row fade-in hover:bg-blue-50 transition-colors bg-blue-50';
                row.className = rowClass;
                
                // 学校名称列 - 添加固定列样式
                const schoolCell = document.createElement('td');
                schoolCell.className = 'py-1 px-2 border border-gray-300 text-xs font-medium auto-font-size tooltip-cell column-width-fixed sticky-first-column';
                schoolCell.textContent = school;
                schoolCell.setAttribute('data-tooltip', school);
                schoolCell.style.width = '96px'; // 固定宽度（六个汉字）
                schoolCell.style.minWidth = '96px'; // 最小宽度（六个汉字）
                schoolCell.style.maxWidth = '96px'; // 最大宽度（六个汉字）
                this.adjustFontSize(schoolCell, school);
                row.appendChild(schoolCell);
                
                // 各教材科目列
                subjects.forEach(subject => {
                    const cell = document.createElement('td');
                    cell.className = 'py-1 px-2 border border-gray-300 text-xs text-right';
                    cell.style.width = '96px'; // 固定宽度（六个汉字）
                    cell.style.minWidth = '96px'; // 最小宽度（六个汉字）
                    cell.style.maxWidth = '96px'; // 最大宽度（六个汉字）
                    
                    const value = schoolData.subjects[subject] || '';
                    
                    // 如果值为空或为0，添加灰色背景样式
                    if (value === '' || value === null || value === undefined || value === 0) {
                        cell.classList.add('empty-value-cell');
                        cell.textContent = '';
                    } else {
                        // 尝试将值转换为数字并格式化
                        const numValue = Utils.parseNumber(value);
                        if (!isNaN(numValue)) {
                            cell.textContent = Utils.formatNumber(numValue);
                        } else {
                            cell.textContent = value;
                        }
                    }
                    
                    row.appendChild(cell);
                });
                
                // 添加单品总册数列（这里显示学校总册数）
                const varietyTotalCell = document.createElement('td');
                varietyTotalCell.className = 'py-1 px-2 border border-gray-300 text-xs text-right font-medium bg-blue-50';
                varietyTotalCell.style.width = '96px'; // 固定宽度（六个汉字）
                varietyTotalCell.style.minWidth = '96px'; // 最小宽度（六个汉字）
                varietyTotalCell.style.maxWidth = '96px'; // 最大宽度（六个汉字）
                varietyTotalCell.textContent = Utils.formatNumber(schoolData.total);
                row.appendChild(varietyTotalCell);
                
                return row;
            }
            
            // 创建合计行
            createSubtotalRow(currentPageData) {
                if (!currentPageData || currentPageData.length === 0) return null;
                
                const subtotalRow = document.createElement('tr');
                subtotalRow.className = 'page-subtotal-row fade-in bg-blue-100';
                
                const subtotalLabelCell = document.createElement('td');
                subtotalLabelCell.className = 'py-1 px-2 border border-gray-300 text-xs font-medium column-width-fixed sticky-first-column';
                subtotalLabelCell.textContent = '小计';
                subtotalRow.appendChild(subtotalLabelCell);
                
                let pageTotal = 0;
                
                // 计算当前页每个学校的小计 - 严格按照表头顺序
                this.schoolHeaders.forEach(school => {
                    const cell = document.createElement('td');
                    cell.className = 'py-1 px-2 border border-gray-300 text-xs font-medium text-right';
                    cell.setAttribute('data-school', school); // 添加数据属性用于匹配
                    
                    const subtotal = currentPageData.reduce((sum, item) => {
                        const value = Utils.parseNumber(item[school]);
                        return sum + value;
                    }, 0);
                    
                    pageTotal += subtotal;
                    cell.textContent = Utils.formatNumber(subtotal);
                    subtotalRow.appendChild(cell);
                });
                
                // 添加当前页单品总册数小计
                const subtotalVarietyCell = document.createElement('td');
                subtotalVarietyCell.className = 'py-1 px-2 border border-gray-300 text-xs text-right font-medium bg-blue-100';
                subtotalVarietyCell.setAttribute('data-total', 'variety'); // 添加数据属性标识
                subtotalVarietyCell.textContent = Utils.formatNumber(pageTotal);
                subtotalRow.appendChild(subtotalVarietyCell);
                
                return subtotalRow;
            }
            
            createTotalRow() {
                if (this.filteredData.length === 0) return null;
                
                const totalRow = document.createElement('tr');
                totalRow.className = 'grand-total-row fade-in bg-blue-200';
                
                const totalLabelCell = document.createElement('td');
                totalLabelCell.className = 'py-1 px-2 border border-gray-300 text-xs font-medium column-width-fixed sticky-first-column';
                totalLabelCell.textContent = '合计';
                totalRow.appendChild(totalLabelCell);
                
                let grandTotal = 0;
                
                // 计算每个学校的合计
                this.schoolHeaders.forEach(school => {
                    const cell = document.createElement('td');
                    cell.className = 'py-1 px-2 border border-gray-300 text-xs font-medium text-right';
                    
                    const total = this.filteredData.reduce((sum, item) => {
                        const value = Utils.parseNumber(item[school]);
                        return sum + value;
                    }, 0);
                    
                    grandTotal += total;
                    cell.textContent = Utils.formatNumber(total);
                    totalRow.appendChild(cell);
                });
                
                // 添加单品总册数合计
                const totalVarietyCell = document.createElement('td');
                totalVarietyCell.className = 'py-1 px-2 border border-gray-300 text-xs text-right font-medium bg-blue-200';
                totalVarietyCell.textContent = Utils.formatNumber(grandTotal);
                totalRow.appendChild(totalVarietyCell);
                
                return totalRow;
            }
            
            // 创建转置模式小计行
            createTransposedSubtotalRow(subjects, currentPageSchools, schoolData) {
                if (!currentPageSchools || currentPageSchools.length === 0) return null;
                
                const subtotalRow = document.createElement('tr');
                subtotalRow.className = 'page-subtotal-row fade-in bg-blue-100';
                
                const subtotalLabelCell = document.createElement('td');
                subtotalLabelCell.className = 'py-1 px-2 border border-gray-300 text-xs font-medium column-width-fixed sticky-first-column';
                subtotalLabelCell.textContent = '小计';
                subtotalRow.appendChild(subtotalLabelCell);
                
                let pageTotal = 0;
                
                // 计算当前页每个教材科目的小计
                subjects.forEach(subject => {
                    const cell = document.createElement('td');
                    cell.className = 'py-1 px-2 border border-gray-300 text-xs font-medium text-right';
                    
                    let subtotal = 0;
                    currentPageSchools.forEach(school => {
                        const value = schoolData[school].subjects[subject];
                        if (value) {
                            subtotal += Utils.parseNumber(value);
                        }
                    });
                    
                    pageTotal += subtotal;
                    cell.textContent = Utils.formatNumber(subtotal);
                    subtotalRow.appendChild(cell);
                });
                
                // 添加当前页单品总册数小计
                const subtotalVarietyCell = document.createElement('td');
                subtotalVarietyCell.className = 'py-1 px-2 border border-gray-300 text-xs text-right font-medium bg-blue-100';
                subtotalVarietyCell.textContent = Utils.formatNumber(pageTotal);
                subtotalRow.appendChild(subtotalVarietyCell);
                
                return subtotalRow;
            }
            
            // 创建转置模式合计行
            createTransposedTotalRow(subjects, schools, schoolData) {
                if (schools.length === 0) return null;
                
                const totalRow = document.createElement('tr');
                totalRow.className = 'grand-total-row fade-in bg-blue-200';
                
                const totalLabelCell = document.createElement('td');
                totalLabelCell.className = 'py-1 px-2 border border-gray-300 text-xs font-medium column-width-fixed sticky-first-column';
                totalLabelCell.textContent = '合计';
                totalRow.appendChild(totalLabelCell);
                
                let grandTotal = 0;
                
                // 计算每个教材科目的合计
                subjects.forEach(subject => {
                    const cell = document.createElement('td');
                    cell.className = 'py-1 px-2 border border-gray-300 text-xs font-medium text-right';
                    
                    let total = 0;
                    schools.forEach(school => {
                        const value = schoolData[school].subjects[subject];
                        if (value) {
                            total += Utils.parseNumber(value);
                        }
                    });
                    
                    grandTotal += total;
                    cell.textContent = Utils.formatNumber(total);
                    totalRow.appendChild(cell);
                });
                
                // 添加单品总册数合计
                const totalVarietyCell = document.createElement('td');
                totalVarietyCell.className = 'py-1 px-2 border border-gray-300 text-xs text-right font-medium bg-blue-200';
                totalVarietyCell.textContent = Utils.formatNumber(grandTotal);
                totalRow.appendChild(totalVarietyCell);
                
                return totalRow;
            }
            
            // 渲染空状态
            renderEmptyState() {
                this.elements.tableBody.innerHTML = '';
                
                const emptyRow = document.createElement('tr');
                
                // 计算列数（教材科目列 + 学校列数）
                const colSpan = 1 + this.schoolHeaders.length;
                
                if (this.bookData.length === 0) {
                    emptyRow.innerHTML = `
                        <td colspan="${colSpan}" class="py-4 px-3 text-center border border-gray-300 text-gray-500 text-sm bg-gray-50">
                            暂无数据，请导入Excel文件
                        </td>
                    `;
                } else {
                    emptyRow.innerHTML = `
                        <td colspan="${colSpan}" class="py-4 px-3 text-center border border-gray-300 text-gray-500 text-sm bg-gray-50">
                            暂无符合条件的订单数据
                        </td>
                    `;
                }
                this.elements.tableBody.appendChild(emptyRow);
            }
            
            // 更新表头 - 最终优化版本，确保与数据完全同步
            updateTableHeaders() {
                try {
                    // 清空现有的表头
                    const headerRow = this.elements.tableHeader.querySelector('tr');
                    headerRow.innerHTML = '';
                    headerRow.className = 'row-height-fixed sticky-header'; // 添加固定行样式
                    
                    if (this.isTransposed) {
                        // 转置模式表头：学校 | 教材科目1 | 教材科目2 | ... | 单品总册数
                        const schoolTh = document.createElement('th');
                        schoolTh.className = 'py-2 px-2 border border-blue-500 text-left font-semibold text-xs column-width-fixed row-height-fixed sticky-first-column';
                        schoolTh.textContent = '学校';
                        schoolTh.style.width = '96px'; // 固定宽度（六个汉字）
                        schoolTh.style.minWidth = '96px'; // 最小宽度（六个汉字）
                        schoolTh.style.maxWidth = '96px'; // 最大宽度（六个汉字）
                        headerRow.appendChild(schoolTh);
                        
                        // 获取所有唯一的教材科目
                        const subjects = [...new Set(this.bookData.map(item => item.subject).filter(subject => subject))];
                        subjects.forEach(subject => {
                            const th = document.createElement('th');
                            th.className = 'py-2 px-2 border border-blue-500 text-left font-semibold text-xs column-width-fixed row-height-fixed';
                            th.textContent = subject;
                            th.setAttribute('data-subject', subject); // 添加数据属性用于匹配
                            th.style.width = '96px'; // 固定宽度（六个汉字）
                            th.style.minWidth = '96px'; // 最小宽度（六个汉字）
                            th.style.maxWidth = '96px'; // 最大宽度（六个汉字）
                            headerRow.appendChild(th);
                        });
                        
                        // 添加学校总册数列（转置模式下）
                        const varietyTotalTh = document.createElement('th');
                        varietyTotalTh.className = 'py-2 px-2 border border-blue-500 text-left font-semibold text-xs bg-blue-700 column-width-fixed row-height-fixed';
                        varietyTotalTh.textContent = '学校总册数';
                        varietyTotalTh.setAttribute('data-total', 'school'); // 添加数据属性标识
                        varietyTotalTh.style.width = '96px'; // 固定宽度（六个汉字）
                        varietyTotalTh.style.minWidth = '96px'; // 最小宽度（六个汉字）
                        varietyTotalTh.style.maxWidth = '96px'; // 最大宽度（六个汉字）
                        headerRow.appendChild(varietyTotalTh);
                    } else {
                        // 正常模式表头：教材科目 | 学校1 | 学校2 | ... | 单品总册数
                        
                        // 使用原始表头的第一列作为教材科目列标题
                        const subjectHeaderText = this.originalHeaders && this.originalHeaders.length > 0 ? this.originalHeaders[0] : '教材科目';
                        const subjectTh = document.createElement('th');
                        subjectTh.className = 'py-2 px-2 border border-blue-500 text-left font-semibold text-xs column-width-fixed row-height-fixed sticky-first-column';
                        subjectTh.textContent = subjectHeaderText;
                        subjectTh.setAttribute('data-header-type', 'subject'); // 添加数据属性标识
                        subjectTh.style.width = '96px'; // 固定宽度（六个汉字）
                        subjectTh.style.minWidth = '96px'; // 最小宽度（六个汉字）
                        subjectTh.style.maxWidth = '96px'; // 最大宽度（六个汉字）
                        headerRow.appendChild(subjectTh);
                        
                        // 添加学校列表头 - 使用原始表头确保严格对应
                        this.schoolHeaders.forEach((school, index) => {
                            const th = document.createElement('th');
                            th.className = 'py-2 px-2 border border-blue-500 text-left font-semibold text-xs column-width-fixed row-height-fixed';
                            th.textContent = school;
                            th.setAttribute('data-school', school); // 添加数据属性用于匹配
                            th.setAttribute('data-index', index); // 添加索引用于严格对应
                            th.style.width = '96px'; // 固定宽度（六个汉字）
                            th.style.minWidth = '96px'; // 最小宽度（六个汉字）
                            th.style.maxWidth = '96px'; // 最大宽度（六个汉字）
                            headerRow.appendChild(th);
                        });
                        
                        // 添加单品总册数列
                        const varietyTotalTh = document.createElement('th');
                        varietyTotalTh.className = 'py-2 px-2 border border-blue-500 text-left font-semibold text-xs bg-blue-700 column-width-fixed row-height-fixed';
                        varietyTotalTh.textContent = '单品总册数';
                        varietyTotalTh.setAttribute('data-total', 'variety'); // 添加数据属性标识
                        varietyTotalTh.style.width = '96px'; // 固定宽度（六个汉字）
                        varietyTotalTh.style.minWidth = '96px'; // 最小宽度（六个汉字）
                        varietyTotalTh.style.maxWidth = '96px'; // 最大宽度（六个汉字）
                        headerRow.appendChild(varietyTotalTh);
                    }
                    
                    // 重置表头的transform，确保位置正确
                    this.elements.tableHeader.style.transform = 'translateX(0)';
                    
                    // 确保表头容器重新计算宽度
                    setTimeout(() => {
                        const headerContainer = this.elements.tableHeaderContainer;
                        const bodyContainer = this.elements.tableBodyContainer;
                        if (headerContainer && bodyContainer) {
                            // 强制重新计算宽度
                            headerContainer.style.width = bodyContainer.offsetWidth + 'px';
                            bodyContainer.style.width = 'auto';
                            
                            // 触发重排
                            void headerContainer.offsetWidth;
                            void bodyContainer.offsetWidth;
                            
                            // 确保表头和表体宽度一致
                            const headerWidth = headerContainer.offsetWidth;
                            bodyContainer.style.minWidth = headerWidth + 'px';
                            
                            // 强制设置表格容器的宽度
                            const tableContainer = this.elements.tableContainer;
                            if (tableContainer) {
                                tableContainer.style.width = 'auto';
                                void tableContainer.offsetWidth;
                            }
                            
                            // 确保表头和表体列宽完全一致
                            this.syncColumnWidths();
                        }
                    }, 100);
                    
                    // 标记表头已更新
                    this.headersUpdated = true;
                } catch (error) {
                    console.error('Error updating table headers:', error);
                    this.headersUpdated = false;
                }
            }
            
            // 更新分页信息
            updatePaginationInfo() {
                // 确保使用正确的数据长度进行计算
                const dataLength = this.filteredData.length;
                const totalPages = Math.ceil(dataLength / this.itemsPerPage);
                
                // 确保当前页码有效
                if (this.currentPage > totalPages && totalPages > 0) {
                    this.currentPage = totalPages;
                }
                
                const startIndex = dataLength > 0 ? (this.currentPage - 1) * this.itemsPerPage + 1 : 0;
                const endIndex = Math.min(this.currentPage * this.itemsPerPage, dataLength);
                
                // 更新显示的分页信息
                if (this.elements.currentRangeElement) {
                    this.elements.currentRangeElement.textContent = dataLength > 0 ? `${startIndex}-${endIndex}` : '0-0';
                }
                if (this.elements.totalRecordsElement) {
                    this.elements.totalRecordsElement.textContent = dataLength;
                }
                if (this.elements.currentPageElement) {
                    this.elements.currentPageElement.textContent = dataLength > 0 ? this.currentPage : '0';
                }
                if (this.elements.totalPagesElement) {
                    this.elements.totalPagesElement.textContent = totalPages > 0 ? totalPages : '0';
                }
                
                // 禁用/启用分页按钮
                const prevDisabled = this.currentPage === 1 || dataLength === 0;
                const nextDisabled = this.currentPage === totalPages || dataLength === 0;
                
                if (this.elements.prevPageBtn) {
                    this.elements.prevPageBtn.disabled = prevDisabled;
                    if (prevDisabled) {
                        this.elements.prevPageBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    } else {
                        this.elements.prevPageBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    }
                }
                
                if (this.elements.nextPageBtn) {
                    this.elements.nextPageBtn.disabled = nextDisabled;
                    if (nextDisabled) {
                        this.elements.nextPageBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    } else {
                        this.elements.nextPageBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    }
                }
            }
            
            // 计算统计信息（使用缓存优化）
            calculateStatistics() {
                // 生成缓存键
                const cacheKey = `stats_${this.isTransposed}_${this.currentSchoolFilter}_${this.currentSearchTerm}_${this.filteredData.length}`;
                
                // 检查缓存中是否有结果
                if (DataCache.has(cacheKey)) {
                    return DataCache.get(cacheKey).value;
                }
                
                // 如果没有缓存，计算统计信息
                const stats = {
                    totalVariety: 0,
                    totalCopies: 0,
                    totalSchools: 0
                };
                
                if (this.filteredData.length === 0) {
                    // 缓存空结果
                    DataCache.set(cacheKey, stats);
                    return stats;
                }
                
                // 确定当前需要统计的学校列表
                let schoolsToCount = [...this.schoolHeaders];
                
                // 如果在转置模式下有搜索结果，只统计匹配的学校
                if (this.isTransposed && this._matchingSchools) {
                    schoolsToCount = [...this._matchingSchools];
                }
                
                // 如果在转置模式下选择了特定学校，只统计该学校
                if (this.isTransposed && this.currentSchoolFilter && this.schoolHeaders.includes(this.currentSchoolFilter)) {
                    schoolsToCount = [this.currentSchoolFilter];
                }
                
                // 使用更高效的方式计算统计信息
                // 一次性遍历数据，计算所有统计信息
                let totalCopies = 0;
                let totalVarietyCopies = 0;
                const schoolDataCount = new Map();
                const varietyDataCount = new Set();
                
                // 初始化学校数据计数
                schoolsToCount.forEach(school => {
                    schoolDataCount.set(school, false);
                });
                
                // 遍历数据，计算统计信息
                this.filteredData.forEach(item => {
                    let rowTotal = 0;
                    let hasDataInRow = false;
                    
                    schoolsToCount.forEach(school => {
                        const value = Utils.parseNumber(item[school]);
                        
                        if (!isNaN(value)) {
                            rowTotal += value;
                            totalCopies += value;
                            
                            // 检查学校是否有数据
                            if (value > 0) {
                                schoolDataCount.set(school, true);
                                hasDataInRow = true;
                            }
                        }
                    });
                    
                    totalVarietyCopies += rowTotal;
                    
                    // 检查品种是否有数据
                    if (hasDataInRow) {
                        varietyDataCount.add(item.subject);
                    }
                });
                
                // 计算不为空的学校数量和品种数量
                const nonEmptySchoolCount = Array.from(schoolDataCount.values()).filter(Boolean).length;
                const nonEmptyVarietyCount = varietyDataCount.size;
                
                // 在转置模式下，总册数和学校总数的含义互换
                if (this.isTransposed) {
                    // 转置模式：总册数显示单品总册数，学校总数显示学校的合计数
                    stats.totalCopiesLabel = '总册数:';
                    stats.totalSchoolsLabel = '学校总数:';
                    
                    // 如果在转置模式下选择了特定学校，只计算该学校的统计数据
                    if (this.currentSchoolFilter && this.schoolHeaders.includes(this.currentSchoolFilter)) {
                        // 计算选中学校的总册数
                        const selectedSchoolTotal = this.filteredData.reduce((sum, item) => {
                            const value = Utils.parseNumber(item[this.currentSchoolFilter]);
                            return sum + value;
                        }, 0);
                        
                        // 计算选中学校中有数据的品种数量
                        const selectedSchoolNonEmptyVarieties = this.filteredData.filter(item => {
                            const value = Utils.parseNumber(item[this.currentSchoolFilter]);
                            return !isNaN(value) && value > 0;
                        }).length;
                        
                        // 总册数显示选中学校的总册数，学校总数显示为1（表示选中了1个学校）
                        stats.totalCopies = selectedSchoolTotal;
                        stats.totalSchools = 1;
                        
                        // 总品种数显示选中学校中有数据的品种数量
                        stats.totalVariety = selectedSchoolNonEmptyVarieties;
                    } else {
                        // 没有选择特定学校时，显示所有匹配学校的统计数据
                        stats.totalCopies = totalVarietyCopies;
                        
                        // 如果有搜索结果，显示匹配的学校数量，否则显示所有不为空的学校数量
                        if (this._matchingSchools) {
                            stats.totalSchools = this._matchingSchools.length;
                        } else {
                            stats.totalSchools = nonEmptySchoolCount;
                        }
                        
                        // 总品种数显示不为空的品种数量
                        stats.totalVariety = nonEmptyVarietyCount;
                    }
                } else {
                    // 正常模式：保持原有显示，但学校总数显示不为空的学校数量
                    stats.totalCopiesLabel = '总册数:';
                    stats.totalSchoolsLabel = '学校总数:';
                    stats.totalCopies = totalCopies;
                    stats.totalSchools = nonEmptySchoolCount;
                    
                    // 总品种数显示不为空的品种数量
                    stats.totalVariety = nonEmptyVarietyCount;
                }
                
                // 缓存结果
                DataCache.set(cacheKey, stats);
                
                return stats;
            }
            
            // 更新统计信息
            updateStatistics() {
                PerformanceMonitor.start('updateStatistics');
                
                // 使用缓存的统计结果
                const stats = this.calculateStatistics();
                
                // 更新DOM元素
                this.elements.totalVarietyElement.textContent = Utils.formatNumber(stats.totalVariety);
                this.elements.totalCopiesElement.textContent = Utils.formatNumber(stats.totalCopies);
                this.elements.totalVarietyCopiesElement.textContent = Utils.formatNumber(stats.totalSchools);
                this.elements.totalCopiesLabel.textContent = stats.totalCopiesLabel || '总册数:';
                this.elements.totalVarietyCopiesLabel.textContent = stats.totalSchoolsLabel || '学校总数:';
                
                PerformanceMonitor.end('updateStatistics');
            }
            
            // 按学校筛选
            filterBySchool(school) {
                this.currentSchoolFilter = school;
                
                // 清除搜索匹配的学校列表
                this._matchingSchools = null;
                
                // 清除相关缓存
                DataCache.clear();
                
                // 应用筛选
                this.applyFilters();
                
                // 更新侧边栏激活状态
                document.querySelectorAll('.sidebar-item').forEach(item => {
                    item.classList.remove('active');
                });
                const activeButton = document.querySelector(`[data-school="${school}"]`);
                if (activeButton) {
                    activeButton.classList.add('active');
                }
            }
            
            // 按教材科目筛选
            filterBySubject(subject) {
                this.currentSubjectFilter = subject;
                
                // 清除搜索匹配的学校列表
                this._matchingSchools = null;
                
                // 清除相关缓存
                DataCache.clear();
                
                // 应用筛选
                this.applyFilters();
                
                // 更新侧边栏激活状态
                document.querySelectorAll('.sidebar-item').forEach(item => {
                    item.classList.remove('active');
                });
                const activeButton = document.querySelector(`[data-subject="${subject}"]`);
                if (activeButton) {
                    activeButton.classList.add('active');
                }
            }
            
            // 搜索功能
            performSearch() {
                this.currentSearchTerm = this.elements.searchInput.value.trim();
                
                // 清除相关缓存
                DataCache.clear();
                
                this.applyFilters();
            }
            
            // 应用所有筛选 - 最终优化版本，确保表头和数据完全同步
            applyFilters() {
                PerformanceMonitor.start('applyFilters');
                
                // 优化：使用缓存减少重复计算
                const filterKey = `${this.currentSchoolFilter}_${this.currentSubjectFilter}_${this.currentSearchTerm}_${this.isTransposed}`;
                
                // 如果筛选条件没有变化，直接返回
                if (this.lastFilterKey === filterKey) {
                    PerformanceMonitor.end('applyFilters');
                    return;
                }
                
                // 保存当前筛选条件
                this.lastFilterKey = filterKey;
                
                // 重置匹配的学校列表
                this._matchingSchools = null;
                
                // 先应用学校筛选
                let filtered = [...this.bookData];
                
                if (this.isTransposed) {
                    // 转置模式：根据选择的学校筛选数据
                    if (this.currentSchoolFilter) {
                        // 转置模式下，我们需要检查是否有匹配的学校
                        if (this.schoolHeaders.includes(this.currentSchoolFilter)) {
                            // 如果有匹配的学校，保持所有数据，但在renderTransposedTable中只显示该学校
                            // 这样可以确保统计信息正确计算
                            this._matchingSchools = [this.currentSchoolFilter];
                        } else {
                            // 如果没有匹配的学校，返回空数组
                            filtered = [];
                            this._matchingSchools = [];
                        }
                    }
                } else {
                    // 正常模式：根据选择的教材科目筛选数据
                    if (this.currentSubjectFilter) {
                        filtered = filtered.filter(item => item.subject === this.currentSubjectFilter);
                    }
                    
                    // 正常模式：根据选择的学校筛选数据
                    if (this.currentSchoolFilter) {
                        filtered = filtered.filter(item => {
                            const value = Utils.parseNumber(item[this.currentSchoolFilter]);
                            return !isNaN(value) && value > 0;
                        });
                    }
                }
                
                // 再应用搜索筛选
                if (this.currentSearchTerm) {
                    filtered = this.filterBySearchTerm(filtered, this.currentSearchTerm);
                }
                
                this.filteredData = filtered;
                this.currentPage = 1;
                
                // 强制重新渲染表格和更新统计信息
                // 使用setTimeout确保异步执行，避免DOM更新冲突
                setTimeout(() => {
                    try {
                        // 重置表头更新状态
                        this.headersUpdated = false;
                        
                        // 先更新表头
                        this.updateTableHeaders();
                        
                        // 等待表头更新完成后再渲染表格
                        setTimeout(() => {
                            if (this.headersUpdated) {
                                // 只有在表头更新成功后才渲染表格
                                this.renderTable();
                                this.updateStatistics();
                                this.updatePaginationInfo();
                                
                                // 确保筛选按钮状态正确更新
                                this.updateSchoolFilters();
                            } else {
                                console.warn('Table headers update failed, skipping table render');
                            }
                            
                            PerformanceMonitor.end('applyFilters');
                        }, 150); // 增加等待时间，确保表头完全更新
                    } catch (error) {
                        console.error('Error in applyFilters:', error);
                        PerformanceMonitor.end('applyFilters');
                    }
                }, 0);
            }
            
            // 按搜索词筛选数据
            filterBySearchTerm(data, searchTerm) {
                const lowerSearchTerm = searchTerm.toLowerCase();
                
                // 转置模式下搜索学校名称
                if (this.isTransposed) {
                    // 查找匹配的学校名称（模糊搜索）
                    const matchingSchools = this.schoolHeaders.filter(school => 
                        school.toLowerCase().includes(lowerSearchTerm)
                    );
                    
                    // 如果没有匹配的学校，返回空数组
                    if (matchingSchools.length === 0) {
                        this._matchingSchools = [];
                        return [];
                    }
                    
                    // 存储匹配的学校列表，供后续使用
                    this._matchingSchools = matchingSchools;
                    
                    // 清除学校筛选条件，以便显示所有匹配的学校
                    if (this.currentSchoolFilter) {
                        this.currentSchoolFilter = '';
                        // 更新筛选按钮状态
                        this.updateSchoolFilters();
                    }
                    
                    // 在转置模式下，我们需要返回所有数据
                    // 因为renderTransposedTable方法会根据this._matchingSchools来控制显示哪些学校行
                    return data;
                }
                
                // 正常模式下搜索教材科目（模糊搜索）
                return data.filter(item => {
                    if (item.subject && item.subject.toLowerCase().includes(lowerSearchTerm)) {
                        return true;
                    }
                    return false;
                });
            }
            
            // 清除搜索
            clearSearch() {
                this.elements.searchInput.value = '';
                this.currentSearchTerm = '';
                // 清除匹配的学校列表
                this._matchingSchools = null;
                // 清除相关缓存
                DataCache.clear();
                this.applyFilters();
            }
            
            // 分页功能
            previousPage() {
                if (this.currentPage > 1) {
                    this.currentPage--;
                    // 先更新分页信息，再渲染表格
                    this.updatePaginationInfo();
                    this.renderTable();
                }
            }
            
            nextPage() {
                const totalPages = Math.ceil(this.filteredData.length / this.itemsPerPage);
                if (this.currentPage < totalPages) {
                    this.currentPage++;
                    // 先更新分页信息，再渲染表格
                    this.updatePaginationInfo();
                    this.renderTable();
                }
            }
            
            changePageSize() {
                this.itemsPerPage = parseInt(this.elements.pageSizeSelect.value);
                this.currentPage = 1;
                // 先更新分页信息，再渲染表格

            // 导出到Excel
            exportToExcel() {
                if (this.filteredData.length === 0) {
                    this.showNotification('没有可导出的数据', 'warning');
                    return;
                }
                
                this.showLoading('正在导出Excel文件...');
                
                try {
                    // 使用setTimeout模拟异步操作
                    setTimeout(() => {
                        // 准备导出数据
                        let exportData = [];
                        
                        if (this.isTransposed) {
                            // 转置模式下的导出逻辑
                            const subjects = [...new Set(this.filteredData.map(item => item.subject).filter(subject => subject))];
                            
                            // 确定要导出的学校列表（考虑搜索结果）
                            const schoolsToExport = this._matchingSchools ? this._matchingSchools : 
                                                   (this.currentSchoolFilter ? [this.currentSchoolFilter] : this.schoolHeaders);
                            
                            // 按学校创建导出数据
                            schoolsToExport.forEach(school => {
                                const schoolRow = {'学校': school};
                                
                                // 添加每个教材科目的数据
                                subjects.forEach(subject => {
                                    const item = this.filteredData.find(i => i.subject === subject);
                                    schoolRow[subject] = item ? item[school] || '' : '';
                                });
                                
                                // 计算学校总册数
                                let schoolTotal = 0;
                                subjects.forEach(subject => {
                                    const item = this.filteredData.find(i => i.subject === subject);
                                    if (item) {
                                        const value = Utils.parseNumber(item[school]);
                                        if (!isNaN(value)) {
                                            schoolTotal += value;
                                        }
                                    }
                                });
                                schoolRow['学校总册数'] = schoolTotal;
                                
                                exportData.push(schoolRow);
                            });
                        } else {
                            // 正常模式下的导出逻辑
                            exportData = this.filteredData.map(item => {
                                const exportItem = {};
                                
                                // 添加教材科目
                                exportItem['教材科目'] = item.subject || '';
                                
                                // 添加学校列
                                this.schoolHeaders.forEach(school => {
                                    exportItem[school] = item[school] || '';
                                });
                                
                                // 计算单品总册数
                                let varietyTotal = 0;
                                this.schoolHeaders.forEach(school => {
                                    const value = Utils.parseNumber(item[school]);
                                    if (!isNaN(value)) {
                                        varietyTotal += value;
                                    }
                                });
                                exportItem['单品总册数'] = varietyTotal;
                                
                                return exportItem;
                            });
                        }
                        
                        // 添加总计行
                        let totalRow = {};
                        
                        if (this.isTransposed) {
                            // 转置模式下的总计行
                            totalRow = {'学校': '总计'};
                            
                            // 获取所有教材科目
                            const subjects = [...new Set(this.filteredData.map(item => item.subject).filter(subject => subject))];
                            
                            // 计算每个教材科目的合计
                            subjects.forEach(subject => {
                                const total = exportData.reduce((sum, row) => {
                                    return sum + (Utils.parseNumber(row[subject]) || 0);
                                }, 0);
                                totalRow[subject] = total;
                            });
                            
                            // 计算学校总册数合计
                            const schoolTotalTotal = exportData.reduce((sum, row) => {
                                return sum + (Utils.parseNumber(row['学校总册数']) || 0);
                            }, 0);
                            totalRow['学校总册数'] = schoolTotalTotal;
                        } else {
                            // 正常模式下的总计行
                            totalRow = {'教材科目': '总计'};
                            
                            // 计算每个学校的合计
                            this.schoolHeaders.forEach(school => {
                                const total = this.filteredData.reduce((sum, item) => {
                                    const value = Utils.parseNumber(item[school]);
                                    return sum + value;
                                }, 0);
                                totalRow[school] = total;
                            });
                            
                            // 添加单品总册数合计
                            const varietyTotal = exportData.reduce((sum, item) => {
                                return sum + (item['单品总册数'] || 0);
                            }, 0);
                            totalRow['单品总册数'] = varietyTotal;
                        }
                        
                        exportData.push(totalRow);
                        
                        const ws = XLSX.utils.json_to_sheet(exportData);
                        const wb = XLSX.utils.book_new();
                        XLSX.utils.book_append_sheet(wb, ws, "书目订单");
                        
                        // 设置列宽
                        const wscols = [
                            {wch: 15}, // 教材科目
                        ];
                        
                        // 为每个学校列设置宽度
                        this.schoolHeaders.forEach(() => {
                            wscols.push({wch: 12});
                        });
                        
                        ws['!cols'] = wscols;
                        
                        // 根据查询条件生成文件名
                        let fileName = "书目订单数据";
                        
                        // 如果有学校筛选条件，添加到文件名
                        if (this.currentSchoolFilter) {
                            fileName += `_${this.currentSchoolFilter}`;
                        }
                        
                        // 如果有搜索关键词，添加到文件名
                        if (this.currentSearchTerm) {
                            // 限制搜索关键词长度，避免文件名过长
                            const searchTerm = this.currentSearchTerm.length > 10 
                                ? this.currentSearchTerm.substring(0, 10) + "..." 
                                : this.currentSearchTerm;
                            fileName += `_搜索_${searchTerm}`;
                        }
                        
                        // 添加日期
                        const today = new Date();
                        const dateStr = today.toISOString().split('T')[0]; // YYYY-MM-DD
                        fileName += `_${dateStr}.xlsx`;
                        
                        XLSX.writeFile(wb, fileName);
                        
                        this.hideLoading();
                        this.showNotification('导出成功', 'success');
                    }, 800);
                } catch (error) {
                    this.hideLoading();
                    this.showNotification('导出失败: ' + error.message, 'error');
                }
            }

                        // 同步左右模块高度 - 修复版
syncModuleHeights() {
    const sidebar = document.getElementById('sidebarContainer');
    const mainContent = document.getElementById('mainContent');
    const tableBodyContainer = document.getElementById('tableBodyContainer');
    
    if (sidebar && mainContent) {
        // 1. 重置高度以获取真实内容高度
        sidebar.style.height = 'auto';
        mainContent.style.height = 'auto';
        
        // 2. 获取主要内容区域的实际高度（不包含表格时的静态高度）
        // 这里假设顶部搜索栏+底部分页大约占 200px，给表格留出剩余空间
        const staticContentHeight = 200; 
        const windowHeight = window.innerHeight;
        const availableTableHeight = windowHeight - staticContentHeight;

        // 3. 设置表格容器的最大高度，但允许其根据内容收缩
        if (tableBodyContainer) {
            // 如果内容很少，就显示实际高度；如果内容很多，就出现滚动条
            tableBodyContainer.style.maxHeight = `${availableTableHeight}px`;
            tableBodyContainer.style.minHeight = '150px'; // 至少显示一点高度
        }

        // 4. 强制侧边栏和主内容区高度一致（基于视口或内容）
        const targetHeight = Math.max(
            sidebar.offsetHeight, 
            mainContent.offsetHeight,
            400 // 最小高度
        );
        
        // 只有当内容很高时才强制等高，否则让其自然流动
        if (targetHeight > 400) {
            sidebar.style.height = `${targetHeight}px`;
            mainContent.style.height = `${targetHeight}px`;
        }
    }
}

            // 调整表格布局，确保水平滚动条正确显示
            adjustTableLayout() {
                const headerContainer = this.elements.tableHeaderContainer;
                const bodyContainer = this.elements.tableBodyContainer;
                const headerTable = document.getElementById('headerTable');
                const bodyTable = this.elements.dataTable;
                
                if (headerContainer && bodyContainer && headerTable && bodyTable) {
                    // 设置容器高度 - 减少顶部和底部的间距，增加表格可见区域
                    const totalHeight = 'calc(100vh - 280px)';
                    const headerHeight = headerContainer.offsetHeight;
                    const bodyHeight = `calc(${totalHeight} - ${headerHeight}px)`;
                    
                    bodyContainer.style.maxHeight = bodyHeight;
                    
                    // 确保表头和表体列宽一致
                    setTimeout(() => {
                        const headerCells = headerTable.querySelectorAll('th');
                        const bodyRows = bodyTable.querySelectorAll('tr');
                        
                        if (bodyRows.length > 0) {
                            const bodyCells = bodyRows[0].querySelectorAll('td');
                            
                            headerCells.forEach((headerCell, index) => {
                                if (bodyCells[index]) {
                                    const headerWidth = headerCell.offsetWidth;
                                    bodyCells[index].style.width = headerWidth + 'px';
                                    bodyCells[index].style.minWidth = headerWidth + 'px';
                                    bodyCells[index].style.maxWidth = headerWidth + 'px';
                                }
                            });
                        }
                    }, 0);
                    
                    // 触发重排
                    void headerContainer.offsetWidth;
                    void bodyContainer.offsetWidth;
                }
            }
            
            // 设置同步滚动 - 完全重写，确保只有一个滚动条且表头跟随滚动
            setupSyncScroll() {
                const headerContainer = this.elements.tableHeaderContainer;
                const bodyContainer = this.elements.tableBodyContainer;
                const tableHeader = this.elements.tableHeader;
                
                if (!headerContainer || !bodyContainer || !tableHeader) return;
                
                // 移除之前的事件监听器（如果存在）
                if (this.syncScrollHandler) {
                    bodyContainer.removeEventListener('scroll', this.syncScrollHandler);
                }
                
                // 确保表头容器样式正确
                headerContainer.style.overflow = 'hidden';
                headerContainer.style.position = 'sticky';
                headerContainer.style.top = '0';
                headerContainer.style.zIndex = '10';
                
                // 创建新的同步滚动处理函数
                this.syncScrollHandler = (e) => {
                    // 当表体滚动时，同步表头的水平位置（除了第一列）
                    if (tableHeader) {
                        // 只对表头的非第一列应用transform
                        const headerCells = tableHeader.querySelectorAll('th:not(:first-child)');
                        headerCells.forEach(cell => {
                            cell.style.transform = `translateX(-${e.target.scrollLeft}px)`;
                        });
                    }
                    
                    // 确保第一列的所有单元格都保持固定
                    const firstColumnCells = document.querySelectorAll('.sticky-first-column');
                    firstColumnCells.forEach(cell => {
                        cell.style.position = 'sticky';
                        cell.style.left = '0';
                        cell.style.zIndex = '1';
                        cell.style.transform = 'translateX(0)'; // 确保不跟随滚动
                        cell.style.backgroundColor = getComputedStyle(cell).backgroundColor; // 确保背景色不透明
                    });
                };
                
                // 只添加表体的滚动事件监听器
                bodyContainer.addEventListener('scroll', this.syncScrollHandler);
                
                // 确保初始化时表头和表体宽度一致
                setTimeout(() => {
                    if (bodyContainer && headerContainer) {
                        headerContainer.style.width = bodyContainer.offsetWidth + 'px';
                    }
                    
                    // 初始化第一列单元格的固定样式
                    const firstColumnCells = document.querySelectorAll('.sticky-first-column');
                    firstColumnCells.forEach(cell => {
                        cell.style.position = 'sticky';
                        cell.style.left = '0';
                        cell.style.zIndex = '1';
                        cell.style.transform = 'translateX(0)'; // 确保不跟随滚动
                        cell.style.backgroundColor = getComputedStyle(cell).backgroundColor; // 确保背景色不透明
                    });
                }, 100);
            }

            // 导入Excel数据
            async importFromExcel(data) {
                // 如果正在导入，先取消之前的导入
                if (this.isImporting) {
                    this.cancelImport();
                }
                
                this.isImporting = true;
                this.importAbortController = new AbortController();
                const signal = this.importAbortController.signal;
                
                try {
                    this.showLoading('正在导入数据...', true, true);
                    
                    console.log('开始导入数据，数据量:', data.length);
                    
                    // 分批处理数据
                    const batchSize = APP_CONSTANTS.BATCH_SIZE;
                    const totalItems = data.length;
                    const totalBatches = Math.ceil(totalItems / batchSize);
                    
                    // 清空现有数据
                    this.bookData = [];
                    this.filteredData = [];
                    
                    // 重置筛选和分页
                    this.currentSearchTerm = '';
                    this.currentSchoolFilter = '';
                    this.currentPage = 1;
                    
                    // 清除搜索框
                    this.elements.searchInput.value = '';
                    
                    // 清除缓存
                    DataCache.clear();
                    
                    // 分批处理数据
                    for (let batchIndex = 0; batchIndex < totalBatches; batchIndex++) {
                        // 检查是否已取消
                        if (signal.aborted) {
                            this.hideLoading();
                            this.showNotification('导入已取消', 'info');
                            return;
                        }
                        
                        // 计算当前批次的起始和结束索引
                        const startIndex = batchIndex * batchSize;
                        const endIndex = Math.min(startIndex + batchSize, totalItems);
                        const batch = data.slice(startIndex, endIndex);
                        
                        // 添加批次数据
                        this.bookData.push(...batch);
                        
                        // 更新进度
                        const progress = ((batchIndex + 1) / totalBatches) * 100;
                        this.updateProgress(progress);
                        
                        // 让出主线程，提高UI响应性
                        await Utils.delay(0);
                    }
                    
                    console.log('数据导入完成，总数据量:', this.bookData.length);
                    
                    // 隐藏加载状态
                    this.hideLoading();
                    
                    // 重置侧边栏选中状态
                    document.querySelectorAll('.sidebar-item').forEach(item => {
                        item.classList.remove('active');
                    });
                    const allBtn = document.querySelector('[data-subject=""]');
                    if (allBtn) {
                        allBtn.classList.add('active');
                        // 根据当前模式更新按钮文本
                        if (this.isTransposed) {
                            allBtn.innerHTML = '<i class="fas fa-school mr-2 w-5 text-center text-blue-500"></i>全部学校';
                        } else {
                            allBtn.innerHTML = '<i class="fas fa-book mr-2 w-5 text-center text-blue-500"></i>全部科目';
                        }
                    }
                    
                    // 更新学校筛选列表
                    this.updateSchoolFilters();
                    
                    // 应用筛选并渲染表格
                    this.applyFilters();
                    
                    // 同步左右模块高度，确保布局一致
                    this.syncModuleHeights();
                    
                    // 延迟更新表头，确保数据已完全导入
                    setTimeout(() => {
                        this.updateTableHeaders();
                        
                        // 显示导入成功模态框
                        this.showImportSuccessModal(`成功导入 ${Utils.formatNumber(this.bookData.length)} 条数据，包含 ${this.schoolHeaders.length} 所学校`);
                        
                        // 重置导入状态
                        this.isImporting = false;
                        
                    }, 200);
                    
                } catch (error) {
                    console.error('导入过程中发生错误:', error);
                    if (!signal.aborted) {
                        this.hideLoading();
                        this.showNotification('导入失败: ' + error.message, 'error');
                        this.isImporting = false;
                    }
                }
            }
            
            // 取消导入
            cancelImport() {
                if (this.importAbortController) {
                    this.importAbortController.abort();
                }
            }
            
            // 切换表格转置
