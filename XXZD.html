                return button;
            }
            
            // 更新学校筛选激活状态
            updateActiveSchoolFilter(activeButton) {
                document.querySelectorAll('.sidebar-item').forEach(item => {
                    item.classList.remove('active');
                });
                activeButton.classList.add('active');
            }
            
            // 导入Excel数据
            async importFromExcel(data) {
                // 如果正在导入，先取消之前的导入
                if (this.isImporting) {
                    this.cancelImport();
                }
                
                this.isImporting = true;
                this.importAbortController = new AbortController();
                const signal = this.importAbortController.signal;
                
                try {
                    this.showLoading('正在导入数据...', true, true);
                    
                    // 分批处理数据
                    const batchSize = APP_CONSTANTS.BATCH_SIZE;
                    const totalItems = data.length;
                    const totalBatches = Math.ceil(totalItems / batchSize);
                    
                    // 清空现有数据
                    this.bookData = [];
                    this.filteredData = [];
                    
                    // 重置筛选和分页
                    this.currentSearchTerm = '';
                    this.currentSchoolFilter = '';
                    this.currentPage = 1;
                    
                    // 清除搜索框
                    this.searchInput.value = '';
                    
                    // 分批处理数据
                    for (let batchIndex = 0; batchIndex < totalBatches; batchIndex++) {
                        // 检查是否已取消
                        if (signal.aborted) {
                            this.hideLoading();
                            this.showNotification('导入已取消', 'info');
                            return;
                        }
                        
                        // 计算当前批次的起始和结束索引
                        const startIndex = batchIndex * batchSize;
                        const endIndex = Math.min(startIndex + batchSize, totalItems);
                        const batch = data.slice(startIndex, endIndex);
                        
                        // 添加批次数据
                        this.bookData.push(...batch);
                        
                        // 更新进度
                        const progress = ((batchIndex + 1) / totalBatches) * 100;
                        this.updateProgress(progress);
                        
                        // 让出主线程，提高UI响应性
                        await new Promise(resolve => setTimeout(resolve, 0));
                    }
                    
                    // 隐藏加载状态
                    this.hideLoading();
                    
                    // 重置侧边栏选中状态
                    document.querySelectorAll('.sidebar-item').forEach(item => {
                        item.classList.remove('active');
                    });
                    document.querySelector('[data-school=""]').classList.add('active');
                    
                    // 应用筛选并渲染表格
                    this.applyFilters();
                    
                    // 显示导入成功模态框
                    this.showImportSuccessModal(`成功导入 ${Utils.formatNumber(this.bookData.length)} 条数据，包含 ${this.schoolHeaders.length} 所学校`);
                    
                } catch (error) {
                    if (!signal.aborted) {
                        this.hideLoading();
                        this.showNotification('导入失败: ' + error.message, 'error');
                    }
                }
            }
            
            // 取消导入
            cancelImport() {
                if (this.importAbortController) {
                    this.importAbortController.abort();
                }
            }
            
            // 渲染转置表格
            renderTransposedTable(currentData, fragment) {
                // 确保使用与导出功能相同的数据源
                const dataToUse = this.filteredData.length > 0 ? this.filteredData : currentData;
                
                // 获取所有唯一的教材科目
                const subjects = [...new Set(dataToUse.map(item => item.subject).filter(subject => subject))];
                
                // 按学校分组数据
                const schoolData = {};
                
                // 确定要处理的学校列表（考虑搜索结果和筛选条件）
                // 与导出功能保持完全一致的逻辑
                const schoolsToProcess = this._matchingSchools && this._matchingSchools.length > 0 ? this._matchingSchools : 
                                       (this.currentSchoolFilter ? [this.currentSchoolFilter] : this.schoolHeaders);
                
                // 初始化学校数据
                schoolsToProcess.forEach(school => {
                    schoolData[school] = {
                        subjects: {},
                        total: 0 // 学校总册数
                    };
                });
                
                // 填充数据并计算学校总册数
                // 与导出功能保持完全一致的逻辑
                schoolsToProcess.forEach(school => {
                    subjects.forEach(subject => {
                        const item = dataToUse.find(i => i.subject === subject);
                        const value = item ? item[school] || '' : '';
                        schoolData[school].subjects[subject] = value;
                        
                        // 累加学校总册数
                        const numValue = Utils.parseNumber(value);
                        if (!isNaN(numValue)) {
                            schoolData[school].total += numValue;
                        }
                    });
                });
                
                // 渲染每行（按学校）
                let index = 0;
                const schoolsToRender = schoolsToProcess;
                
                // 检查是否有学校需要渲染
                if (schoolsToRender.length === 0) {
                    // 如果没有学校需要渲染，显示空状态
                    const emptyRow = document.createElement('tr');
                    const colSpan = 1 + subjects.length + 1; // 学校列 + 科目列 + 合计列
                    emptyRow.innerHTML = `
                        <td colspan="${colSpan}" class="py-4 px-3 text-center border border-gray-300 text-gray-500 text-sm bg-gray-50">
                            暂无符合条件的数据
                        </td>
                    `;
                    fragment.appendChild(emptyRow);
                    return;
                }
                
                schoolsToRender.forEach(school => {
                    const row = document.createElement('tr');
                    const rowClass = index % 2 === 0 
                        ? 'compact-row fade-in hover:bg-blue-50 transition-colors' 
                        : 'compact-row fade-in hover:bg-blue-50 transition-colors bg-blue-50';
                    row.className = rowClass;
                    
                    // 学校名称列
                    const schoolCell = document.createElement('td');
                    schoolCell.className = 'py-1 px-2 border border-gray-300 text-xs font-medium auto-font-size tooltip-cell';
                    schoolCell.textContent = school;
                    schoolCell.setAttribute('data-tooltip', school);
                    this.adjustFontSize(schoolCell, school);
                    row.appendChild(schoolCell);
                    
                    // 各教材科目列
                    subjects.forEach(subject => {
                        const cell = document.createElement('td');
                        cell.className = 'py-1 px-2 border border-gray-300 text-xs text-right';
                        
                        const value = schoolData[school].subjects[subject] || '';
                        
                        // 如果值为空，添加红色背景样式
                        if (value === '' || value === null || value === undefined) {
                            cell.classList.add('empty-value-cell');
                            cell.textContent = '空';
                        } else {
                            // 尝试将值转换为数字并格式化
                            const numValue = Utils.parseNumber(value);
                            if (!isNaN(numValue)) {
                                cell.textContent = Utils.formatNumber(numValue);
                            } else {
                                cell.textContent = value;
                            }
                        }
                        
                        row.appendChild(cell);
                    });
                    
                    // 添加单品总册数列（这里显示学校总册数）
                    const varietyTotalCell = document.createElement('td');
                    varietyTotalCell.className = 'py-1 px-2 border border-gray-300 text-xs text-right font-medium bg-blue-50';
                    varietyTotalCell.textContent = Utils.formatNumber(schoolData[school].total);
                    row.appendChild(varietyTotalCell);
                    
                    fragment.appendChild(row);
                    index++;
                });
                
                // 添加合计行
                const totalRow = document.createElement('tr');
                totalRow.className = 'page-total-row fade-in bg-blue-100';
                
                const totalLabelCell = document.createElement('td');
                totalLabelCell.className = 'py-1 px-2 border border-gray-300 text-xs font-medium';
                totalLabelCell.textContent = '合计';
                totalRow.appendChild(totalLabelCell);
                
                let grandTotal = 0;
                
                // 计算每个教材科目的合计
                subjects.forEach(subject => {
                    const cell = document.createElement('td');
                    cell.className = 'py-1 px-2 border border-gray-300 text-xs font-medium text-right';
                    
                    let total = 0;
                    schoolsToProcess.forEach(school => {
                        const value = schoolData[school].subjects[subject];
                        if (value) {
                            total += Utils.parseNumber(value);
                        }
                    });
                    
                    grandTotal += total;
                    cell.textContent = Utils.formatNumber(total);
                    totalRow.appendChild(cell);
                });
                
                // 添加单品总册数合计
                const totalVarietyCell = document.createElement('td');
                totalVarietyCell.className = 'py-1 px-2 border border-gray-300 text-xs text-right font-medium bg-blue-100';
                totalVarietyCell.textContent = Utils.formatNumber(grandTotal);
                totalRow.appendChild(totalVarietyCell);
                
                fragment.appendChild(totalRow);
            }
            
            // 切换表格转置
            toggleTranspose() {
                if (this.bookData.length === 0) {
                    this.showNotification('暂无数据可转置', 'warning');
                    return;
                }
                
                this.isTransposed = !this.isTransposed;
                
                // 更新转置按钮文本
                const transposeBtn = document.getElementById('transposeBtn');
                if (this.isTransposed) {
                    transposeBtn.innerHTML = '<i class="fas fa-sync-alt mr-1"></i>恢复';
                    transposeBtn.classList.remove('bg-indigo-500', 'hover:bg-indigo-600');
                    transposeBtn.classList.add('bg-purple-500', 'hover:bg-purple-600');
                } else {
                    transposeBtn.innerHTML = '<i class="fas fa-exchange-alt mr-1"></i>转置';
                    transposeBtn.classList.remove('bg-purple-500', 'hover:bg-purple-600');
                    transposeBtn.classList.add('bg-indigo-500', 'hover:bg-indigo-600');
                }
                
                // 更新表头
                this.updateTableHeaders();
                
                // 重新渲染表格
                this.renderTable();
                
                // 更新学校筛选列表
                this.updateSchoolFilters();
                
                // 显示状态提示
                this.showNotification(this.isTransposed ? '已转置表格' : '已恢复表格', 'info');
            }
        }

        // 当DOM加载完成后初始化应用
        document.addEventListener('DOMContentLoaded', () => {
            // 初始化应用
            window.app = new BookManagementApp();
            
            // 初始化轮播图
            initCarousel();
            
            // 调整侧边栏和主内容区高度一致
            adjustSidebarHeight();
            
            // 窗口大小改变时重新调整高度
            window.addEventListener('resize', adjustSidebarHeight);
        });
        
        // 调整侧边栏和主内容区高度一致
        function adjustSidebarHeight() {
            const sidebarContainer = document.querySelector('.sidebar-container');
            const mainContent = document.querySelector('.main-content');
            
            if (sidebarContainer && mainContent) {
                // 获取主内容区的高度
                const mainContentHeight = mainContent.offsetHeight;
                
                // 设置侧边栏高度与主内容区一致
                sidebarContainer.style.height = `${mainContentHeight}px`;
                
                // 调整学校筛选区域的最大高度
                const schoolFilterContainer = document.getElementById('schoolFilterContainer');
                if (schoolFilterContainer) {
                    // 计算学校筛选区域的最大高度（减去标题和统计信息的高度）
                    const headerHeight = document.querySelector('.sidebar-container h2').offsetHeight;
                    const statsHeight = document.querySelector('.sidebar-container .mt-4').offsetHeight;
                    const padding = 32; // 考虑内边距
                    
                    const maxFilterHeight = mainContentHeight - headerHeight - statsHeight - padding;
                    schoolFilterContainer.style.maxHeight = `${maxFilterHeight}px`;
                }
            }
        }
        
        // 轮播图功能
        let currentSlide = 0;
        let slideInterval;
        const slides = document.querySelectorAll('.carousel-slide');
        const indicators = document.querySelectorAll('.carousel-indicator');
        const totalSlides = slides.length;
        
        // 初始化轮播图
        function initCarousel() {
            // 显示第一张幻灯片
            showSlide(0);
            
            // 开始自动轮播
            startAutoSlide();
        }
        
        // 显示指定幻灯片
        function showSlide(index) {
            // 确保索引在有效范围内
            currentSlide = (index + totalSlides) % totalSlides;
            
            // 更新幻灯片显示
            slides.forEach((slide, i) => {
                slide.classList.toggle('active', i === currentSlide);
            });
            
            // 更新指示器状态
            indicators.forEach((indicator, i) => {
                indicator.classList.toggle('active', i === currentSlide);
            });
        }
        
        // 切换到上一张/下一张幻灯片
        function changeSlide(direction) {
            // 清除当前的自动轮播计时器
            clearInterval(slideInterval);
            
            // 显示目标幻灯片
            showSlide(currentSlide + direction);
            
            // 重新开始自动轮播
            startAutoSlide();
        }
        
        // 直接跳转到指定幻灯片
        function goToSlide(index) {
            // 清除当前的自动轮播计时器
            clearInterval(slideInterval);
            
            // 显示目标幻灯片
            showSlide(index);
            
            // 重新开始自动轮播
            startAutoSlide();
        }
        
        // 开始自动轮播
        function startAutoSlide() {
            // 每5秒切换一次幻灯片
            slideInterval = setInterval(() => {
                changeSlide(1);
            }, 5000);
        }

        // 处理文件上传
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            // 验证文件类型和大小
            if (!validateFile(file)) {
                return;
            }
            
            // 保存文件引用，用于后续处理
            window.currentImportFile = file;
            
            // 重置文件输入
            event.target.value = '';
            
            // 显示密码输入模态框
            showPasswordModal();
        }
        
        // 验证文件类型和大小
        function validateFile(file) {
            // 检查文件类型
            const fileExtension = file.name.split('.').pop().toLowerCase();
            if (!APP_CONSTANTS.EXCEL_EXTENSIONS.includes(`.${fileExtension}`)) {
                window.app.showNotification('请上传.xls或.xlsx格式的Excel文件', 'error');
                return false;
            }
            
            // 检查文件大小
            if (file.size > APP_CONSTANTS.MAX_FILE_SIZE) {
                window.app.showNotification('文件大小不能超过50MB', 'error');
                return false;
            }
            
            return true;
        }
        
        // 处理文件导入
        function processFile(file) {
            // 如果正在导入，先取消之前的导入
            if (window.app.isImporting) {
                window.app.cancelImport();
            }
            
            // 显示加载状态
            window.app.showLoading('正在读取Excel文件...');
            
            // 直接在主线程处理Excel文件
            try {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    try {
                        // 解析Excel文件
                        const data = new Uint8Array(e.target.result);
                        
                        // 修复：使用正确的配置解析.xls文件
                        const workbook = XLSX.read(data, { 
                            type: 'array',
                            cellDates: true,
                            cellNF: false,
                            cellText: false,
                            raw: false
                        });
                        
                        // 获取第一个工作表
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        
                        // 转换为JSON，保留原始表头
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { 
                            header: 1 // 保留原始表头
                        });
                        
                        // 检查数据是否为空
                        if (jsonData.length <= 1) {
                            throw new Error('Excel文件中没有找到数据');
                        }
                        
                        // 提取表头和数据
                        const headers = jsonData[0];
                        
                        // 检查是否至少有2列（教材科目、至少一个学校）
                        if (headers.length < 2) {
                            throw new Error('Excel文件格式不正确，至少需要包含教材科目和一个学校列');
                        }
                        
                        // 固定第一列为教材科目
                        const subjectHeader = headers[0];
                        
                        // 后面的列全部为学校名称
                        const schoolHeaders = headers.slice(1);
                        
                        // 检查是否有学校列
                        if (schoolHeaders.length === 0) {
                            throw new Error('Excel文件中没有找到学校列，请确保前两列之后有学校数据');
                        }
                        
                        // 转换为对象数组
                        const dataObjects = [];
                        for (let i = 1; i < jsonData.length; i++) {
                            const row = jsonData[i];
                            
                            // 跳过空行
                            let isEmptyRow = true;
                            for (let j = 0; j < row.length; j++) {
                                if (row[j] !== undefined && row[j] !== null && row[j] !== '') {
                                    isEmptyRow = false;
                                    break;
                                }
                            }
                            
                            if (isEmptyRow) {
                                continue;
                            }
                            
                            const obj = {
                                subject: row[0] || ''
                            };
                            
                            // 添加学校数据
                            for (let j = 1; j < headers.length; j++) {
                                const school = headers[j];
                                obj[school] = row[j];
                            }
                            
                            dataObjects.push(obj);
                        }
                        
                        // 检查是否有有效数据
                        if (dataObjects.length === 0) {
                            throw new Error('Excel文件中没有找到有效数据');
                        }
                        
                        // 保存学校表头
                        window.app.schoolHeaders = schoolHeaders;
                        
                        // 更新表头
                        window.app.updateTableHeaders();
                        
                        // 隐藏加载状态
                        window.app.hideLoading();
                        
                        // 导入数据
                        window.app.importFromExcel(dataObjects);
                        
                        // 更新学校筛选列表
                        window.app.updateSchoolFilters();
                        
                    } catch (error) {
                        handleImportError('处理文件失败: ' + error.message);
                    }
                };
                
                reader.onerror = function() {
                    handleImportError('读取文件失败');
                };
                
                // 读取文件
                reader.readAsArrayBuffer(file);
                
            } catch (error) {
                handleImportError('初始化导入失败: ' + error.message);
            }
        }
        
        // 处理导入错误
        function handleImportError(errorMessage) {
            window.app.hideLoading();
            window.app.showNotification(errorMessage, 'error');
            window.app.isImporting = false;
        }
        
        // 显示密码输入模态框
        function showPasswordModal() {
            // 获取模态框元素
            const passwordModal = document.getElementById('passwordModal');
            const passwordInput = document.getElementById('passwordInput');
            const passwordError = document.getElementById('passwordError');
            const confirmPasswordBtn = document.getElementById('confirmPasswordBtn');
            const cancelPasswordBtn = document.getElementById('cancelPasswordBtn');
            
            // 重置输入和错误状态
            passwordInput.value = '';
            passwordError.classList.add('hidden');
            passwordInput.focus();
            
            // 显示模态框
            passwordModal.classList.remove('hidden');
            
            // 确认按钮点击事件
            const handleConfirm = function() {
                const password = passwordInput.value.trim();
                
                // 验证密码
                if (password === APP_CONSTANTS.IMPORT_PASSWORD) {
                    // 密码正确，隐藏模态框并处理文件
                    passwordModal.classList.add('hidden');
                    processFile(window.currentImportFile);
                    
                    // 移除事件监听器
                    confirmPasswordBtn.removeEventListener('click', handleConfirm);
                    cancelPasswordBtn.removeEventListener('click', handleCancel);
                } else {
                    // 密码错误，显示错误信息
                    passwordError.classList.remove('hidden');
                    passwordInput.select();
                }
            };
            
            // 取消按钮点击事件
            const handleCancel = function() {
                // 隐藏模态框，取消导入
                passwordModal.classList.add('hidden');
                
                // 移除事件监听器
                confirmPasswordBtn.removeEventListener('click', handleConfirm);
                cancelPasswordBtn.removeEventListener('click', handleCancel);
            };
            
            // 添加事件监听器
            confirmPasswordBtn.addEventListener('click', handleConfirm);
            cancelPasswordBtn.addEventListener('click', handleCancel);
            
            // 回车键事件
            passwordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    handleConfirm();
                }
            });
        }
    </script>
