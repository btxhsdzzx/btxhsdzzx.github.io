<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日志查询</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.9);
            --highlight-color: #ffde59;
            --card-shadow: rgba(0, 0, 0, 0.1);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-primary);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .container {
            width: 100%;
            max-width: 900px;
        }
        header {
    text-align: center;
    margin-bottom: 40px;
    /* 开启3D空间 */
    perspective: 1000px; 
}

/* 替换原有的 h1 样式 */
h1 {
    font-size: 2.8rem;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 10px;
    /* 核心3D设置 */
    transform-style: preserve-3d;
    /* 添加动画 */
    animation: float3D 6s ease-in-out infinite;
    /* 文字立体阴影 */
    text-shadow: 
        0 1px 0 #ccc,
        0 2px 0 #c9c9c9,
        0 3px 0 #bbb,
        0 4px 0 #b9b9b9,
        0 5px 0 #aaa,
        0 6px 1px rgba(0,0,0,.1),
        0 0 5px rgba(0,0,0,.1),
        0 1px 3px rgba(0,0,0,.3),
        0 3px 5px rgba(0,0,0,.2),
        0 5px 10px rgba(0,0,0,.25),
        0 10px 10px rgba(0,0,0,.2),
        0 20px 20px rgba(0,0,0,.15);
}

/* 定义3D浮动动画关键帧 */
@keyframes float3D {
    0% {
        transform: rotateX(10deg) rotateY(10deg) translateZ(0);
    }
    50% {
        transform: rotateX(-10deg) rotateY(-5deg) translateZ(20px) scale(1.05);
    }
    100% {
        transform: rotateX(10deg) rotateY(10deg) translateZ(0);
    }
}
        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        .search-box {
            width: 100%;
            padding: 18px 24px;
            font-size: 1.1rem;
            border: 2px solid var(--glass-border);
            border-radius: 50px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .search-box::placeholder {
            color: rgba(255,255,255,0.7);
        }
        .search-box:focus {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
        .log-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .log-item {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 28px;
            border-radius: 20px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 8px 32px var(--card-shadow);
            display: flex;
            flex-direction: column;
        }
        .log-item:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
        }
        .log-date {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.25);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 16px;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .log-content {
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--text-secondary);
            white-space: pre-wrap;
            word-break: break-word;
            text-align: justify;
        }
        .highlight {
            background-color: var(--highlight-color);
            color: #333;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            box-shadow: 0 0 8px rgba(255, 222, 89, 0.6);
        }
        .no-results {
            text-align: center;
            font-size: 1.2rem;
            opacity: 0.8;
            margin-top: 50px;
            display: none;
            font-style: italic;
        }
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .log-item { padding: 20px; border-radius: 16px; }
            .log-content { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✨ Work Log</h1>
            <p>输入关键词，快速检索您的工作记录</p>
        </header>
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 搜索日期、关键词或内容...">
        <ul id="logList" class="log-list"></ul>
        <div id="noResults" class="no-results">😔 抱歉，未找到匹配的日志条目。</div>
    </div>
        <script>
        const logs = [
            { date: "2016.5.8", content: "删除远程桌面连接MSTSC多余的信息，即找到注册表里面:HKEY_CURRENT_USER\\ Software\\Microsoft\\Terminal ServerClient\\Default 其中右边的就是，你连接过的记录了。删除您需要清除的文件即可。" },
            { date: "2016.06.10", content: "在财务管理模块中，补录的旧单据不在维护对账单里显示，生成的对账单在结算里可以看到。" },
            { date: "2016.06.18", content: "业务员手动添货的页面中【在途册数】是所有订货的合计，与其到没到货没有关系。如果【库存数】大于【到货数减去销售数】说明此书目不止一个购进单位。" },
            { date: "2016.06.30", content: "录入员在单据明细里如果实收录入错误，可以在【检索】里按条件筛选出该书目条目后更改。具体错误表现在【到货单据】和【单据明细】的数量与实洋不一致，其他数据一样。" },
            { date: "2016.07.01", content: "当批销音像时，选择客户档案里的音像固定折扣，在【批销管理】下的浮动折扣定义中，选择【音像制品批价制定原则】中的【按客户固定折扣和零售价推算】后确认。" },
            { date: "", content: "打折促销的设置 \n只要是涉及到打折的情况，全部选取书目ID号，所以货位打折情况是在某种书目上到一个货位的情况才实用。当某一种图书在一个货区不同货位上都有库存，这时设置该固定货位折扣则会把该书目ID号选中，导致这一书目其他货位全部都打折，而不是设置过的这个货位才打折。" },

            { date: "", content: "RF按任务下架中，可退数为该店号总库存，库存为该库房库存，任务数是此次下达的任务。\n下架重新定位输入书号后，显示的定价和书名不是该书号的信息。\n重新定位是指没有下过架的书目，修改是指已经下架过的书目。" },
            { date: "", content: "当卖场预退到退货库图书不想实退而要返回卖场时，因为该数据被预退占用，返回后不能二次预退。只能更改数据库。此时可以把图书返回卖场，记住该预退批次等数据，销售完成后再次拉单返回退货库做预退修改即可。select * from t_hythmx_yt where id='9787513100885002' for update" },
            { date: "", content: "下架可退书数是减掉预退数的结果，当预退数没有变成实退返回部组后会导致可退数小(减去预退数后的数值)" },
            { date: "", content: "卖场RF下架时，当某种书在该库房有多货位时，会在货位信息栏后出现三个小点，点击可以查看该书的具体货位库存情况。(打开的可视界面只显示一条货位信息)" },
            { date: "", content: "卖场RF下架时，如遇按任务要求实在找不到所要下架的书目时，可以点击【跳过】并继续下一种书目的查找。" },
            { date: "", content: "在未确认此预退批次前如果又找到了此前跳过的书目，这时候可以点击【重新定位】按键扫描该书号后重新执行下架操作。" },
            { date: "", content: "如果已经确认生成预退批次，在15日内找到该书且退货库没有发运该书货源的退货，可以继续在任务里执行下架操作。" },
            { date: "", content: "卖场RF下架时，如遇按任务要求实在找不到所要下架的书目时，可以直接在下架栏里输入0并回车，此时该书目默认已经下架且数量为零。" },
            { date: "", content: "在未确认此预退批次前如果又找到了该书，这时候可以点击【修改】按键扫描该书号后重新执行下架操作。" },
            { date: "", content: "如果已经确认生成预退批次，但又找到了之前下架数为零该书，此时该书只能改为主动下架。" },
            { date: "", content: "【进货销售情况】查询的销售指的是某单据的日期或调拨日期截止现在的销售数据，而【货区销售情况】或【货源销售情况】指的是某销售时间段的销售数据，以上必须反勾才能实现查询。" },
            { date: "", content: "财务自进货按单结账 \n在发票页面，托收单金额一般不做更改。价款栏系统会自带出和托收单金额一致的价款。" },
            { date: "", content: "如付款小于托收金额，此时可以按付款金额更改发票金额和实付金额，并且会在本次调整金额里显示出其差价。" },
            { date: "", content: "如果发卡写卡的时候出现忘记勾选下一个卡号，而在不同卡上写入N次同一卡号(如系统的卡号依次为001，002，003等)，对应的卡上显示的也是001，002，003等，此时操作错误(001正确，002正确，003写卡时系统还是勾选002，并已经执行写卡操作)，此时再想写入正确的003卡号系统已经终止执行，因为此卡已经写入数据了(错误的002卡)。这个时候可以把已经写入002卡信息的003卡进行初始化，再进行发卡写卡。" },
            { date: "", content: "当预退折扣数据和到货的折扣不一致时候，可以在【预退修改并确认】里修改折扣。" },
            { date: "", content: "自进货到货录入时同一货源不能用同一单号，系统不会提示错误。请看清到货单据单号再录入，一般不会有相同单号，但是客户代码是一样的。如更改不了单号可在单号后面任意加一数字测试即可知道是否是此原因。" },
            { date: "5.16", content: "在批销音像制品时，整单折扣和一单一折是根据【浮动折扣定义】中音像制品批价制定规则修改实现的，选中【按客户固定折扣及零售价推算】一般用于整单折扣，选中【按客户类型浮动折扣及零售价推算】一般用于一书一折。注意音像制品批销单据中出现的是价格而不是折扣。" },
            { date: "5.17", content: "【储值卡消费记录】旗县区各店无法查询其中数据，只有在市店的系统中才能查到，市店【储值卡消费记录】中可以查询各店储值卡消费记录。旗县店如查询IC消费记录可以在本系统的【储值卡发行情况】里的【IC卡使用流水情况】输入卡号或操作日期即可查询。" },
            { date: "6.5", content: "新货区的建立如果现有分类全部被已有货区使用，但需建立新的货区使用已有的分类，最好在结完账没有销售及库存转移的情况下，删除原有货区的分类，建立新货区，增加该分类，并批量货位调整到新货区。" },
            { date: "", content: "到货缺收的处理北配收货如果接收北配数据有缺收时，在【到货分流】下的缺收会自动分书到缺收库房。" },
            { date: "", content: "自进货录入当自进货录入完成后分流时发现有缺收时，可按实际数进行分流，缺收单据在【单据打印】里的【收货差异单】进行查询，点击打印可查看明细情况。" },
            { date: "", content: "当该单据分流完成后，又发现缺收的书，这是可以在原始单据号后追加“-1”进行再一次追加录入。连同收货差异单及第一二次的调拨单据一并交与财务。" },
            { date: "6.15", content: "销售统计中“销售实洋-毛利=到货实洋”" },
            { date: "7.17", content: "【前台销售查询】中可以查看小票的销售明细及缴款情况，双击可以看到是否为IC卡、现金等收款方式。" },
            { date: "7.18", content: "供货单位【新华文化传媒】的主题诗文系列，在【进货销售情况】里查看总库存为零，但该供货单位下有该品种的库存(由于空退期间有销售，反勾后形成自采进货部的销售并形成其负库存数)，实际上库存应该为零。这个时候业务人员可以向财务说明情况并可向该供货单位承付货款。由于空退形成无主货源的销售在反勾后，都会体现成自采进货部销售并形成负库存数，同时正确的货源待进货后再销售时库存数已在自采进货部形成销售后减少。" },
            { date: "8.2", content: "如想统计EXCEL表格有多少空格可用函数=COUNTBLANK(A2:D9)类似来表示计算。" },
            { date: "8.23", content: "收款pos机断网销售，必须同步数据才能上传销售数据，此时可以结账，并结账后可以查看货区销售数据明细，但看不到销售情况里的数据，一般在二十分钟左右就可以看到了。" },
            { date: "8.23", content: "WIN10家庭版连接XP共享打印机，首先在win10的电脑上安装适合win10的打印驱动，然后打开控制面板的增加打印机选择不在列，再选最后一项通过手动设置再选创建新端口LOCAL，输入\\\\ip地址\\打印机共享名，再选择已安装好的打印机型号即可。" },
            { date: "8.23", content: "如发现更新网卡驱动后打开软件时提示“此实现不是WINDOWS平台FIPS验证的加密算法的……”,并显示一堆英文，这时候可以在注册表中找到HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\Lsa项；点击Lsa项，点击下方跳出的FipsAlgorithmPolicy项，右侧表内出现一个默认项和一个Enabled项双击Enabled项；把数值数据框中的数据改为0即可正常使用了(XP系统里点击LSA后右侧出现的FipsAlgorithmPolicy双击后改其数值为零)。" },
            { date: "8.28", content: "基本公式 \n1、销售毛利率 = （销售收入-进货成本）/销售收入*100%；\n2、库存周转次数 = 销售额/平均库存额，平均库存额=（期初库存+期末库存）/2；\n3、退货率 = 退货商品码洋/商品进货码洋*100%；\n4、人均购书额 = 销售码洋/当地人口；\n5、盘亏率 = 损益码洋/销售码洋*100%;\n6、报废率 = 报废码洋/销售码洋*100%;\n7、利润率=利润/成本*100%=(卖价-进价)/进价*100%" },
            { date: "12.22", content: "新增内部销售查询中，在批销中不包括批销退货，但在批销查询中是含批销退货的。内部销售查询只能在盟市店一级查看，如查询时发现库存为空可能是旗县店没有做到货的缘故。内部销售查询必须考虑盟市店一书多货源情况，更要考虑旗县区店该品种多货源进货的情况。" },
            { date: "12.25", content: "当批销对账后该书目的发现卡由“未到账批销”改为“现货批销”，批销日期也由原来的日期变更为对账日期。" },
            { date: "12.26", content: "当接收批销数据做到货后，如想再次做二次批销的，一定要等客户回款了以后再做对账，以免不必要的麻烦。" },
            { date: "01.23", content: "集团通知要求：图书自进货到货录入时，文教类的书法图书需要用02开头的分类，并对应好不同年级！文艺类的书法图书一律用03020105这个编号！更不允许录入收货单位为“无货源”的货源" },
            { date: "3.1", content: "退货货源更正后，在发行卡查到的退货货源是之前为更正的退货货源，但是在自进货按单对账中勾选退货单据时，可以选择更正后的货源，更正之前的货源由于正负冲抵不在显示在原货源退货单据里。" },

            { date: "5.14", content: "【会员管理】中【延期】按钮可以输入天数负值。" },
            { date: "1.1", content: "销售系统中，选择收款方式IC卡和其他组合付款后，需要退款时应先选择IC卡退之前的付款金额，再选择其他方式进行退款；如果先选择其他方式退款再选择IC卡退款，系统会弹出已选择IC卡退款不允许再次选择其他付款方式进行退款。" },
            { date: "5.14", content: "储值卡充值中里的折扣含义：例如充值100元，折扣为40，实则充值金额为100元，实收金额为40元。但销售折扣是之前在充值审核时的折扣，与此处无关。" },
            { date: "5.15", content: "重新查看4.2强制收款单据发现：小票单据尾号为4441的按原价购得图书四种，合计码洋750元，后退款准备按九折销售。结果云结算又按原价点错强制收款了。实际没有扫描付款码。后又现金按九折销售。" },
            { date: "7.12", content: "销售POS系统卸载，需要删除注册表POSREG里的所有数值，还有MYSQL AB的数值，注意找到两项对应文件里的东西后删除。64位系统和32位系统注册表值有所不同。" },
            { date: "8.9", content: "当某一种书不同货源的情况下同时主动下架，且都没有确认的情况下，输入下架数量后他们的可退数会显示为减去全部下架数的值。例如：A货源可退数为5，B货源可退数为20，如果两个货源主动下架这种书，当A货源先输入下架数5后，A货源的可退数为0(该批次没有确认)，此时再下架B货源的20册时，会发现B货源的可退数为15，只能退15册不是20册,因已经减去了A货源的5册。当输入B货源下架数为15后，再看已下架未确认A货源的可退数变为-15。解决办法是完成一批次后，再操作另一批次，可退数即可正确显示，下架数也可正常输入。" },
            { date: "8.20", content: "当做退货下架时，下架数可以大于库存数(这时会有提示对话框)但不能大于可退数，库存数是指该库房该品种的库存数，可退数是指该货源该品种的库存数。" },
            { date: "8.21", content: "把图片背景做字体颜色，打开PS，打开需要的图，输入文字，将背景在图层窗口中复制并拖到文字层的上面。在图层窗口中，按住alt，点击图层与文字层之间（鼠标变成黑色向下的箭头），将原背景删除或填充别的颜色。OK搞定" },
            { date: "10.8", content: "《中国标准出版社》出版的国家标准类图书，请分类至“09020111”其他杂志，（国家标准类图书）这个分类！书号不允许含有标点符号。" },
            { date: "10.9", content: "更改退货货源后，该书目发行卡上的货源是第一次没更改后的货源，货源退货查询里原退货货源数量变为负数，更正后的退货货源为正数，自进货按单对账里则不会出现原退货货源的单据，只有更正后的退货货源的该单据。" },
            { date: "10.15", content: "找出一列里相同的数值并标识\n1、 打开EXCEL表格，选择整列单元格，点击“开始”--条件格式--突出显示单元格规则。\n2、选择”重复值“设置突出显示的颜色即可。" },
            { date: "10.18", content: "借阅网点设置操作员后，该操作员不可再次被选择，以便确定其唯一性。该操作员进入系统后执行图书借阅操作既是根据该网点的图书库存。某一店号下所有的会员可以通用。" },
            { date: "12.21", content: "更正退货货源后，按货源退货统计看有两次记录，但实退数合计为零。更正后的货源数据，单品种发行卡上显示不正确，还是显示之前的退货货源，不是更正后的退货货源。在自进货按单对账里则不再显示之前错误的退货单据，只显示更正后的退货单据。" },
            { date: "1.8", content: "统计到货品种时，不能按货源统计，会有重复的品种。销售不能按部组或核算单位统计。" },
            { date: "", content: "盘点要点纪要：\n盘点前做好清欠工作，上架任务必须完成，下架确认后的实物需运往退货库或隔离盘点现场，确认无在途存货（数据已入库但无实物），下班前完成后台结账。\n请关闭盘点服务器防火墙，RF才能连接到数据库！！！\n设置盘点pos机前必须将当天销售后台结账后再设置。\n盘存确认后，如设置盘点pos机后有销售，立即查看库存情况和货区库存情况数据一致并等于盘点码洋。必须等待一会再查看会发现库存情况码洋减少，减少码洋为设置盘点pos机后销售的码洋。货区库存码洋不变和盘点码洋一致。按日进行后台结账后，货区码洋减少销售数据等同于库存码洋。\n账实对比中新增的盘点详情，不同于之前的独立盘点详情模块，这里新增有盘点期间的POS销售数据。\n盘点服务器初始化是清除历史盘点记录，每次新盘点时可以点击清除记录。\n如有货区更改或新加，必须在一般字典中将货区字典表中的货区类型先改为其他再保存后再改回来才行，要不在盘点服务器中及采集器里看不到该货区。\n如果盘点服务器没有上传盘点数据，在RF枪里输入该货位时，会出现已经存在的卡号。但是当上传完时，该卡号就不会出现。\n有到货差异查询时，将填好的【查询单据】上交业务主管领导签字，在盘存调整完后进行逐一检查，如确实有报损情况，可以先做日常报益，再进行空退，做主动下架退货至自采进货部（如可能同时可让业务向相应出版社发出查询凭证冲减到货总实洋）。损益需在第二天才可以在打印损益单里看到。\n盘存确认前不得进行货位跨区调整和转移等操作。\n【POS机定义】如果要定义盘点结束时间必须是前后台结完帐后才能定义，否则会在定义后无法结账，而在盘点结束调整完会导致货区库存情况正确，库存情况会将未结账的在盘点调整时减少一次，结完账还会减少一次。切不可没有结账先设盘点POS机，应该在结完账后再设置盘点POS机。\n盘点POS机设置步骤：系统设置→POS机定义→确认盘点结束时间→确定。\n部门编号填写要盘点的店号，注册码为店号的后四位，例如部门编号123456，则注册码为3456。 验证安装 密码为店号+0987，例如店号123456，密码1234560987 ；盘点上传的密码  店号+pdmanager。\n手收销售的书目可以按登记册上书目统计本货区总码洋，在其货区找对应价格且书目库存为零的(尽量少的品种及册数)，将品种及册数码洋登记在手收本上后直接在其货区盘点，待盘存调整后进行销售。" },
            { date: "6.18", content: "如果EXCEL表格中修改某列为日期时发现修改后日期不对，可以先选择此列数据点击数据后再点分列后选择日期点完成即可。" },
            { date: "6.21", content: "如粘贴EXCEL表格中数字不带小数点取整数但是必须四舍五入(之前设置为小数点位数0，看到是整数但点击后发现还有小数点)，可以使用函数实现=ROUND(公式，0)。不需要四舍五入只取整数可以用函数=INT(公式)。" },
            { date: "8.1", content: "Excel中，数字是按国际通用方法使用千位分隔符，但是如果在数据较大时，想显示为常用的万位如何表示呢？选择单元格或区域，右击，在出现的快捷菜单中，点击”设置单元格格式“—”数字“—”自定义“—”类型“—输入”0!.0,“—”确定“，数字即按万位显示。" },
            { date: "8.13", content: "如果EXCEL表格里的数据不能更改为数值、不能求不能更改小数点位数等，选择要更改数据列，工具栏中，数据-分列，即可更改小数点位数了" },
            { date: "8.23", content: "启用win10管理员权限：搜索框输入CMD,管理员运行；或命令提示符右键点击管理员运行。输入net user administrator /active:yes 成功后先注销重启启用管理员账户并删除原来账户。" },
            { date: "12.12", content: "卖场RF退货流程\n业务下达退货任务后，书城人员用RF接收下架任务批次，并输入箱号，当这一箱号装满书后，点确认。另起一箱号继续这一任务的下架操作装满后点确认，一直把这一任务完成，如果有找不到的书可点跳过继续下一本。为方便退货库验货，书城下架要求是一箱一单。\n书城在下架完成后打印装箱单点查询(也就是预退查询)，选定日期输入退货库房和供货单位后再点查询。可查看预退批次号和箱号。再返回上一界面，输入相对应容器号和批次号点击预退箱单后打印。\n退货库按箱单对货即可，要求书城完成一货源任务后(或者剩下的书目不退了，剩下的下架数置0。)才能将书拉到退货库做实退。" },
            { date: "12.12", content: "下架注意事项\n在提取下架批次的时候，如正在执行下架操作，且未点确认此箱号（不是确认的整个批次任务）。显示界面是暂存任务，想打印下架任务完成情况表这时候是打不出来的，在起始界面只能打印下架校核单。必须确认此箱号的任务后(确认后此任务数还在且有已下架数)，点击退货下架的按任务下架提取批次号,会自动显示出之前下过的任务批次(虽然已经确认了N个箱号，但此任务批次任务数不变)，这时候可以打印下架任务完成情况表。" },
            { date: "12.12", content: "数据恢复和更正\n如果在【到货管理】下录入到货发现错误时，可以在【到货管理】下的【到货单据恢复】里修改，查询出该错误单据双击后恢复。恢复后是到上一步操作，在【到货分流】完成前可以恢复，如已经【到货分流】完成则不能进行数据恢复。\n必须注意以下情况不能做到货数据恢复：\na、单据未录入完成，\nb、书目等待审核， \nc、包件未确认。\n如果【到货录入】分流完成后或退货后数据有错，可以进入【物流管理】下的【数据更正】里修改。可以更改单头信息和退货货源以及明细信息。" },
            { date: "12.12", content: "到货分流\n对已收到包件进行指定上架去向，也是验货的环节，并且为物流上架做准备。\n进入【到货分流】，选中原始单据点击[验货]对照实物输入实收数（这里的实收数为实际数量，如后有缺收，系统自动算出差异）、箱号、破损数、破损箱号（另外一个）后点击回车。当单据上的书目全部验完后（即没有未校验的数据，可以点击【数量不同】查看本单的任务和实际是否有差异）点击[分流完成]。最后在【物流管理】里输入箱号后打印“装箱单”，将“装箱单”放入箱内一并送往对应卖场或库房。" },
            { date: "9.3", content: "货区销售和结账汇总单销售实洋一致，都是抹零后实洋，销售情况里的实洋是指未抹零的实洋，所以他们有差异。" },
            { date: "9.5", content: "储值卡余额模块发生变化，之前的充值金额包括新旧系统切换导入的数据，现在不包括了。发现上市集中办公时导出的2018年年末的余额较现在导出的2018年年末余额少了16.80元。" },
            { date: "12.12", content: "在日常的【后台结账】中，不能结账则会出现“id=9787*********001没有物理货位”的情况，这时候只需在【物流管理】下【货位调整(日常)】增加这个id号的货位即可，值得注意的是这个ID号后三位是不需要输入的，增加货位后数量默认为零，所以对库存没有什么影响。如果增加货位时提示有未完成的上架任务，说明此书是在上架任务中，需货区操作员看上架任务选择后完成此上架任务。如有上架任务未完成，到货上架中看任务也没有，可以到物流管理下的箱号占用情况查询，找到箱号和占用人，登录占用人系统，再到上架任务中输入箱号回车即可显示上架任务。" },
            { date: "12.12", content: "当款台收银员刷会员卡进行销售时，如发现折价为售价，找零为零的异常情况，说明该会员卡的折扣数据丢失变为零折扣，这时需要取消销售确认，到服务台更正该会员档案，会员类型及销售折扣改为正常方可再次销售。" },
            { date: "12.12", content: "各货区工作人员用RF枪执行下架任务时，如发现以前遗留且不需再下架操作时，可用此货区的操作员登陆电脑，选择下架任务后删除。" },
            { date: "12.12", content: "业务分书\n手动分书操作方式：进入【业务分书】，点击[选单]，查询已经登记或自录的“到货单据”，点击[确认]后，添加相应的参与分书门市，可输入对应的比例数，点击[分书]按钮，这里是预分，分书操作后会后在右下的界面中出现预分详情，如有需要还可根据实际需求修改预分数，在[打印预分单]预览分书情况，确认无误后点击[提交]按钮，系统会下达到货分流任务。" },
            { date: "12.12", content: "书目审核监控\n当录入的单据明细数据和到货数据一致时，可点击【单据确认】并可提交成功。如数据不一致系统则自动提示。提交成功的单据一般会在【书目审核监控】里显示，由集团信息中心人员负责审核，当在【可预分】里显示为“是”的时候，选择该条信息就可点击【单据确认】提交信息。如果【单据确认】后没有在【书目审核监控】中显示。则说明此录入单据没有需要审核的书目信息，直接可在【业务分书】选单后继续操作。" },
            { date: "12.12", content: "书名录入：\nA．录入书名时，遇到系列丛书时，应先录入副标题，然后再录入主标题。主标题和副标题之间一般用2个横杠隔离（教辅类图书除外）。\nB．教辅类图书因字节较多，一般的录入规则是年级+科目+上或下+版种+书名，如二年级上人教最新AB卷。\nC．成套或者含盘的图书，在书名前以半角方式录入括号，填入（全几册）、（上下）、（含盘）。\nD．图书中含有“《》”或者“”时必须添加并需把书名录全。\nE．当图书附带光盘或者磁带等制品并且其自含书号时，应以图书的书号为准。" },
            { date: "12.12", content: "到货信息标准(自进货到货录入)\n1.	发货单位：按照各出版社及供应商的名称输入，系统中没有需要添加的。上传该供应商营业执照及组织机构代码证照片给相关信息人员，待集团信息中心审核后添加。\n2.	发货单号：依照随货同行单据上的提书单号或者清单编号等相关编号如实填写。无发货单号的按录入日期后加两位依次录入。如：2016050101\n3.	单据日期：按照到货单据上的制单日期录入，无制单日期的按实际日录入。\n4.	单据品种、册数：按照到货单据上显示的数字录入，如有缺书或者多书的情况，需在原始单据上注明实际册数，避免财务账务处理不一致。\n5.	单据码洋、实洋：按照到货单据显示数字录入，如有缺书或者多书的情况，需在原始单据上注明实际码洋、实洋，如有因数据统计方式不同（四舍五入或保留小数位数）造成的差异，应以本系统录入结果为准（差错一般不大于0.10元）。\n6.	书号（ISBN）：ISBN为国际标准书号，新版ISBN书号由13位数字组成，如有旧系统原来的10位书号应当使用软件转换为13位标准ISBN书号。\n7.	图书折扣：按照到货单据上的折扣录入，遇到“倒折扣”时，必须注意区分（看码洋和实洋的关系）。\n8.	图书版别：一般在扫描书号时即可将版别识别，当不能正确识别图书版别应及时查明原因处理。" },
            { date: "12.12", content: "图书翻理标准\n1.	及时拆包，抽取样书，并认真核对来货是否与到货清单相符。\n2.	使用RF数据采集器进行到货分流时，要将所分流图书进行装箱编号(见箱号使用规则)，原则上最多每3筐为一个箱号，单品种数量较大除外。\n3.	每批货分流结束时要进入包件数量不同中查看是否有遗漏数据，发现有误要及时更正，确认无误后，进行确认。\n4.	待全部图书装箱分流完成后打印装箱单据。注意避免打印装箱单据后，又向此箱单内装书" },
            { date: "12.12", content: "数据录入规则(自进货到货录入)\n书号录入：\nA．系统自动带出书名及其他信息，首先要核对是否与录入图书信息相符，如没有明显问题不能视为新书录入，保持数据的一致性。\nB．当录入的书号为非法书号时，只能录入数字，不能录入英文字母、标点符号及空格。\nC．当图书没有ISBN书号或者其他非法书号时，应以价格为书号并在其后面加上四位校验码（即流水号），并做手工记录，如：定价为1998.00元，自编书号为1998000001" },
            { date: "12.12", content: "马上购支付升级\n马上购接入云闪付后增加了跨店统一支付和钱包加微信的组合支付，方便读者在钱包支付的过程中不够需要充值再支付。\n1、之前页面只能单店选择。此次升级可以一次选择多店进行同时支付。\n2、在支付时如果新华钱包余额不够的情况下，可以使用微信（云闪付）支付剩余金额。当支付完成后，订单会按所属店铺进行拆分，如果是组合支付，各店的金额会以新华钱包的支付方式传下去销售。\n3、注意事项：\n（1）如果读者是跨店结算时，只有支持邮费模板的情况下，才可以跨店支付。\n（2）邮费会收取最高的那一笔，根据各店图书金额，按权重比分配这个邮费。" },
            { date: "12.12", content: "接收批销数据\n统计分析→到货→在途单据→原始单据号→到货管理→包件登记→填写包件号→提取运单→单号→确认→业务分书→选单→查询→确认→选择门市→点分书(可增加门市、单品种情况下)→打印预分单(可不打印)→提交→到货分流→验货→查看已分流数据等等。" },
            { date: "12.12", content: "主动下达退货流程\n1、业务员下达退货任务：商流管理—→主动下达退货任务—→筛选条件—→选择下架货区—→选定退货货源—→确认—→填写退货数量—→确认。\n2、卖场下架：物流管理—→退货下架—→点选按任务下架(此时可打印下架任务，RF枪和PC上操作有所不同) —→库存数转移到退货库。\n3、退货库实退：物流管理—→打印退货单据—→查询—→选中需要实退的单据—→预退修改并确认—→暂存—→确认—→打印退货单据—→附单据打包发货。" },
            { date: "12.12", content: "批销开单\n在批销管理的批销开单中，选择购货单位，输入批销书目的条码（或按F4查找书目），输入批销册数后回车，确认无误后确认，按提示打印贴头后再次确认。\n说明：按折扣进货方式的品种在输入购货单位前，如果勾选一书一折，则批销的折扣=发货折扣+上浮折扣，且折扣可以随意改动（需要修改的权限及密码）；如果勾选的是整单折扣，则批销的折扣=客户档案中定义的固定折扣，后期修改折扣时需要修改权限及密码。" },
            { date: "12.12", content: "手动添货流程\n商流管理→手动添货→条件添货→按本部条件→选定货源→输入销售日期→本人所管分类(去掉对勾)→确认→填入订数→报订→选择报订货源→确认。" },
            { date: "12.12", content: "北配上报销售数据\n在【财务管理】模块下的【北配对账】里向北配上报销售数据。具体操作：选中批次打勾（可点全选），再点击【确认】即可上报。如果辽批需要对账可在【单据维护】里点击【打印】（可不打印）选择导出后QQ上传至北配。" },
            { date: "12.12", content: "新货区的建立\n如果现有分类全部被已有货区使用，但需建立新的货区使用已有的分类，应在后台结完账没有销售及库存转移的情况下，删除原有货区的分类，建立新货区，增加该分类，并批量货位调整到新货区。" },
            { date: "12.12", content: "到货包件登记 \n在收到北配数据以及系统内批销数据时，必须在【包件登记】里做到货，依次填入包件号及运单信息。如有包件号不清楚的情况，可以在【统计分析】里到货情况下的在途单据查看包件号。     \n具体如下：\n统计分析→到货→在途单据→原始单据号→到货管理→包件登记→填写包件号→提取运单→单号→确认→业务分书→选单→查询→确认→选择门市→点分书(可增加门市、单品种情况下)→打印预分单(可不打印)→提交→到货分流→验货→查看已分流数据等等。\n注：在有可接收的数据时，不需再自己录入也不允许自己录入，一旦手工录入后，该条可接收的数据在系统一直存在。" },
            { date: "12.12", content: "商场网络\n192.168.123.2-254；255.255.255.0；192.168.123.1；AP:新华奥莱  xhsd8888	\n华三10.5.1.137；登录：admin；密码：xhsd8888。\n商场监控；登录：admin ；密码：xh888lk。\n个人IP使用从 150开始。" },         
            { date: "12.13", content: "微商城自提销售目前没有写进发行卡，但进销存和库存数正确，例如到货2，自提销售1，发行卡没有显示自提销售1这条记录，但库存数会变为1。" },
            { date: "12.12", content: "销售系统\n收款员在POS机上操作销售系统时注意的几个按键(注意区分不同界面的功能键的)： \n[F4]书号/条码切换：确定书目的录入框内，用户输入的是书号还是条码； \n[F5]扫描/录入切换：扫描方式是默认数量为1，录入方式是录入书号好回车，光标自动跳转到数量输入框，允许录入数量； \n[F6]会员信息：显示会员信息提取界面， 录入会员编号后自动提取会员的相关信息；\n[F8]结账：销售图书信息后，确认无误，按此功能件则进入到销售结账界面 。\n[F7]读卡：把IC卡放入读卡器后，按此功能键，提取IC卡信息，刷卡额=本次销售销售金额-已交款金额，卡余额=卡内金额-本次刷卡额，补现金为卡内金额小于应交款时产生； 注意如有读者在IC消费后退货，必须插卡退货；\n[F8]扣款确认：如读卡信息无误后，按此功能键，确认刷卡，此时卡金额已经扣除，必须完成此次交款； 注意：如果使用储值卡交款的，储值卡刷卡成功后销售结帐过程中发生异常，或者没有异常提示也未进行小票打印的，请收款员务必确认储值卡的扣款是否正确，若pos上无法确认请及时联系本店系统管理员，以确保储值卡卡值与系统内一致。\n[CTRL]+[W]完成收款：按照缴款方式，输入缴款额后，按组合功能键[CTRL]+[W]，完成销售并打印销售小票；\n在销售结账界面内，光标默认在书目条码输入框内，扫描书目条码后，系统读取库存书目信息，并将默认数量为1的销售书目放到上册列表内，从列表内可看到该书的定价及库存数，在界面会直接显示应交金额，和是否打折的相关销售信息。\n如在扫描书目是弹出多条书目信息的话说明该书为一号多书品种，请结合该书的库存和书名认真选条目后销售。\n非卖场活动打折的销售，需具有打折权限的人员授权。\n收银员下班需要结账的，在主菜单界面中选择【前台结账】。 [F8]提取未结账的单据， 按照规定输入内容，ctrl+w 完成结账。收款员收款时应认真选择顾客交款方式，前台结账后将结账小票连同销售的现金、银联小票、书券等一同交付后台结账人员。\n如果连接打印机失败，则提示打印错误，交款成功后，系统返回到销售主界面，在主界面有最近销售，查询需要打印的销售小票 【F3】后打印。这里需要上级授权。" },
            { date: "12.13", content: "做损益调整时，当某品种没有货位是不允许调整的，这时必须增加货位。" },
            { date: "12.30", content: "会员缴款合计应从会员档案管理明细查看，实际的办卡数为总办卡数减去丢失补办的卡数。结合会员缴款汇总验证其准确性。" },
            { date: "7.23", content: "智慧书城活动策略优先等级数值较大优先，如全场类目九折优先等级90，单品五折优先等级89，则所有商品都九折，如更改单品五折等级91则五折优先，其余的还是九折。目前同一优先等级不会折上折。" },
            { date: "1.20", content: "查询机销售如需整单退货，更改后需要点击强制整单退货，并输入登陆密码。（读者不需要点击申请退款）" },
            { date: "8.12", content: "新华社北京8月12日电 中国共产党中央委员会、中华人民共和国全国人民代表大会常务委员会、中华人民共和国国务院、中国人民政治协商会议全国委员会沉痛宣告：中国共产党的优秀党员，久经考验的忠诚的共产主义战士，杰出的无产阶级革命家、政治家，党和国家的卓越领导人，中国共产党第十四届、十五届中央政治局常委，国务院原总理朱镕基同志，因病医治无效，于2026年8月12日11时06分在北京逝世，享年98岁。\n朱镕基同志，1928年10月生，湖南长沙人。\n1948年12月参加革命工作，1949年10月加入中国共产党。他青少年时期就热爱祖国，勤奋好学，追求进步，矢志报国。\n1991年，朱镕基同志任国务院副总理兼国务院生产办公室主任、党组书记，兼国务院经济贸易办公室主任、党组书记，分管机电能源、铁道交通、冶金化工、轻工纺织等工作。\n1997年9月，朱镕基同志在中共十五届一中全会上再次当选为中央政治局委员、常委。\n1998年3月，在九届全国人大一次会议上，他被任命为国务院总理，后担任国务院党组书记。\n2003年3月，朱镕基同志不再担任国务院总理职务。" },
            { date: "2.18", content: "内部客户批销多元需改浮动折扣定义中的音像制品批价制定原则为：按客户类型浮动折扣及零售价推算（也就是平进平出）。如非内部客户批销一般是按客户类型固定折扣及零售价推算。" },
            { date: "3.17", content: "储值卡查询记录里可查看该卡全部消费记录，而储值卡发行情况里的IC使用流水消费里只包含本店消费记录，不含有本点卡异地消费记录。" },
            { date: "4.6", content: "上市财务报表单品种到货实洋是按实际到货实洋为准的。库存实洋是准确的，原则还是采取先进先销原则。例如书号“9787532751471”先进3本60折的，后进4本65折的。销售2本后的库存实洋是一本60折的加上4本65折的。" },
            { date: "4.9", content: "批销时如折扣为**.**。则必须按单本算出来保持两位小数再进行运算。但折扣为**则算是可按汇总直接计算；批销催款单是指未核销的加上未对账的。" },
            { date: "4.28", content: "给蒙新连锁000002做预退后不用确认处理，待对方核对做数据后直接变为实退数据。如果市店做预退后，不需要做实退了，待对方做数据为零后，市店在物流管理中连锁店处理拒退，点击无实物据退后操作即可。" },
            { date: "4.29", content: "批销客户财务代码需要在各店18打头的系统财务管理下维护。" },
            { date: "5.11", content: "大中专教材系统在出库时已经确定销售折扣，之后不可更改（联系专业人员后台更正），不允许出库后更正销售折扣。" },
            { date: "5.20", content: "增加客户档案时，需要查看系统是否有此客户，在有购货单位的选项的地方可以录入关键字进行甄别。在原店号加号客户档案后到18打头的系统财务管理下再增加财务代码。" },
            { date: "5.29", content: "教材系统凭证转换需在用户管理下设置教材人员，至少一个为凭证推送人员，其财务代码处是NC操作员的字母简拼，另一个教材人员的财务代码是NC里的教材人员的六位数字编号。部门财务代码必须是末端代码。" },
            { date: "6.5", content: "当win10系统的电脑共享XP系统的打印机时，需在win10系统的卸载程序中，找到启用或关闭windows功能，找到SMB 1.0文件共享处打勾选中。" },
            { date: "6.10", content: "全区查看销售店号150010，操作员3333、9003、0058" },
            { date: "12.12", content: "关于收款系统内置核销抖音券的注意事项\n1、抖音券与移动支付组合结算：\读者使用抖音券与微信、支付宝、新华钱包组合支付时，请通过收款系统内置功能验券：扫描商品条码后，按F9 打开云结算界面，优先扫描抖音券二维码（注意：若一个二维码含多张券，需逐张扫码核销，扫一次核销一张）。已核销的券将显示在界面右上方。\n注意：若交易未完成需更换图书，请勿直接点击窗口右上角“×”关闭。应先点击右上方抖音券明细中的“取消”按钮，再关闭窗口，以免数据异常锁死抖音券。\n如不小心点到”X”关闭得情况下，请前往CMS系统中的“云结算”-“交易列表”中，在单据受理状态中筛选“未受理”中找到对应单据点击“撤销核销”\n注：撤销请在一小时内处理，如超出时间前往“抖音来客”退券。\n2、抖音券与书卡组合结算：\n读者使用抖音券后剩余金额用书卡（储值卡）支付时，请通过“抖音来客”APP 核销抖音券，剩余金额在收款系统内选择“补贴券”选项，再调用储值卡界面完成扣款。\n注意：若储值卡扣款后读者需更换图书，请先完成当前交易，再进行整单退款，切勿直接关闭储值卡扣款界面，以免储值卡被锁定。\n3、退款重要规则：\n所有涉及抖音券的订单，如需退款，必须整单操作，不支持部分退款，请务必遵守。" },
            { date: "12.12", content: "WIN10系统安装POS程序方法\n第一步\n用 IE 浏览器下载安装 POS 零售系统，下载地址：http://lsdpos.nmgxhsd.cn/posmain/pos.htm\n第二步\n下载 everything 地址：www.voidtools.com/zh-cn/，安装 64位即可。\n第三步\n打开“ everything”软件，将以下路径复制到软件中，找到POS 零售程序对应的 exe 文件按图所示进行操作↓C:\Users\名称\AppData\Local\Apps\2.0；注意： “名称”此处参考实际登录用户进行修改,右键→发送到→快捷方式至桌面,右键图标属性→设置 以管理员身份运行此程序”，确定保存,重新打开即可" },
            { date: "6.18", content: "路由及IP查询\n综合办公室路由器10.5.1.58   \n教育服务部路由10.5.1.90   \n副总办公室路由器10.5.1.93  \n商场运营路由器10.5.1.94（登陆和wifi密码cf12345678）   \n会议大屏10.5.1.95  ；会议室路由器10.5.1.96，会议大屏电脑客户端10.5.1.97，会议室工作站10.5.1.98  \n 资产运营部路由10.5.1.99  192.168.5.1   \n财务管理部路由10.5.1.158  \n会议室教学屏10.5.1.196	\n书城四楼策划打印机共享192.168.124.30 \n书城新零售笔记本192.168.124.35	\n书城新零售工作站192.168.124.36 \n书城业务办公室NP17F5673打印机192.168.124.37  \n策划路由器192.168.124.38 \n书城办公室路由器192.168.124.39            \nRF枪 文艺60，61；社科62，63；文教64，65，66；少儿67，68；多元69，\n备用59银行POS设备192.168.124.70-74	\n查询机设备192.168.124.75-78，\n书城笔记本192.168.124.79  \n五台移动收银设备192.168.124.80-84   \n书城两台鸿合大屏192.168.124.85-86   \n书城两台联想小新拯救者笔记本192.168.124.87和89   \n书城国补设备192.168.124.90   \n书城直播用手机192.168.124.229    \n核销平板192.168.124.228   \n书城主题展台监控192.168.124.230（231-236）" },
            { date: "7.15", content: "POS机销售系统优化后销售退货可修改数量。不用再以品种退货，避免了单一品种多数量的情况下销售退货后再销售。" },
            { date: "7.23", content: "销售情况中查询云支付销售不会包含教材的品种的销售，因为POS销售和教材销售是两种销售形式。只能在线上销售综合校核里查看。" },
            { date: "8.19", content: "草原书屋\n1、进入图书管理系统建立批销客户，选择缴款类型为托收客户、客户类型为草原书屋、经纬度必须录入。\n2、记住生成的书屋编号，可在客户档案界面查看。\n3、针对草原书屋做批销开单，批销类型为其他一般客户。\n4、下载草原书屋管理系统。销货店编号为书屋的编号。用户参照文档。一般为9999，进入草原书屋接收数据。\n5、图书借阅针对小程序端，图书归还都可以。线下借阅只针对PC端。小程序是预借。PC端借阅前提也必须是小程序注册的会员。\n6、微信小程序搜索“草原借阅+”" },
            { date: "10.25", content: "储值卡可以进行封卡和解卡操作。但封卡后在储值卡月报会显示异常，异常金额为该卡的余额。月报的余额加上该储值卡异常的金额为储值卡余额表中的余额合计。" },
            { date: "11.25", content: "教材转入品种只能通过教材转出到教材系统，如果多转可以再从教材转回来，不可以使用退货更正。" },
            { date: "12.10", content: "储值卡异地消费承付审核为确认，会占用，如否决，应删除承付即可回到未承付界面。这时候消费情况和未承付数据一致了。" },
            { date: "1.25", content: "excel表格内如将显示为零的数值变空白，可以选择文件点击选项，选高级，再取消显示数值为零的即可。" },
            { date: "6.13", content: "包头书城不明原因出现21年9月2日销售未结账数据，今日结账，财务建议不上交此结帐单。原计划做销退。" },
            { date: "9.01", content: "业务系统货源销售查询中注意筛选条件中的单据类型，销售不包含教材销售，报废、损益都是单独的单据类型。" },
            { date: "12.30", content: "如有大厦和蒙新打回的退货单据，应在物流管理下的连锁店处理据退中，点击无实物据退，选择好业务部门为000001的是大厦，000002是蒙新，选择好单据打勾，点击确定即可由退货库直接到卖场，且自动上架。蒙新的多元来货不和图书一样，无法接收数据，必须手工录入。" },
            { date: "3.21", content: "云结算未生成销售小票的，刷新成功后再结账，只在原有收银员账号里能查看最近销售小票。" },
            { date: "4.26", content: "卸载更新使用运行wusa /uninstall /kb:5025221即可。" },
            { date: "12.12", content: "图书零售POS系统卸载流程\n1、控制面板-管理服务-服务，找到MySql服务，点击右键停止；\n2、删除windows--MySql服务，开始菜单运行：sc delete MySql    \n3、然后在控制面板添加或删除程序中找到pos程序正常卸载；\n4、删除数据库文件；\n开始菜单运行：regedit,打开注册表。：HKEY_LOCAL_MACHINE\SOFTWARE\MySql AB\MySql Server 5.0；\n打开DataLocation子项，删除DataLocation键值指向目录下的所有文件(此为删除数据库文件)；\n打开Location子项，删除Location键值指向目录下的所有文件(此为删除数据库文件)。\n5、最后删除对应注册表项\nHKEY_LOCAL_MACHINE\SOFTWARE\(32位系统)\nHKEY_LOCAL_MACHINE\SOFTWARE\Wow6432Node\PDReg(64位系统)\nMySql AB（数据库）\nPosReg（POS程序）\nPDReg(盘点系统)；\n6、c盘的C:\Program Files\MySQL 全删除（把路径从文档里复制出来，直接在地址栏里粘贴，然后回车）；\nC:\Documents and Settings\All Users\Application Data\MySQL\MySQL Server 5.5 目录下 全删除（把路径从文档里复制出来，直接在地址栏里粘贴，然后回车）；\n7、如果更新后无法启动, 你可能需要: XP用户: 删除 %userprofile%\Local Settings\Apps 目录下的2.0目录 ；Vista及Win7用户: 删除 %userprofile%\AppData\Local\Apps 目录下的2.0目录。" },
            { date: "5.26", content: "cms程序下微商城的订单列表后，出现下载订单说明没有传到ERP系统，需点击下传。正常已下传的订单不会有这个按钮的。月底前应筛选下，防止订单跨月。跨月不可操作的还有云结算流水未成功的，必须当月刷新成功，再到未结账小票处理打印小票。" },
            { date: "6.15", content: "如果U盘安装系统就后PE后找不到硬盘了，应该选中SATA那个选项，按回车后出来两个选项，选中AHCI 那个选项，将他切换为IDE就可以了。" },
            { date: "11.08", content: "期货订货提交后，只有操作员定义里设定的业务员上级主管才可以进行期货订货审核。即使该上级主管是注销状态，启用后也可看到提交的审核数据。" },
            { date: "1.25", content: "零售销售收入和线上销售中的新华钱包已按要求改为应收（除大厦自营店）。原来的预收科目已更正。" },
            { date: "1.25", content: "到货情况里的未入库单据中已登记即录入完成。还没进行分书、分流、上架等操作。" },
            { date: "2.5", content: "ERP业财凭证中零售销售收入的储值卡异店卡挂账问题已发布，请查看凭证分录或28比例分账是否有问题。之前财务凭证中销售如果有储值卡都是是减预收，现在更改为如果是储值卡中异店卡就走应收，本店卡依然是减预收。" },
            { date: "2.21", content: "联营商户消费IC卡，目前无法做凭证推送，所以生成的凭证里预收款项里会缺少联营商户的IC卡消费金额。" },
            { date: "2.28", content: "储值卡综合查询中，新增分别查询图书、联营的消费金额选项。" },
            { date: "9.9", content: "你是谁？哈哈，你应该是内蒙古新华发行集团的成员。姓名不详哈。" },
            { date: "3.01", content: "连锁店系统新增“特定书目查询”功能，用于指定书目销售查询（如：主题出版物）" },
            { date: "3.06", content: "安装谷歌浏览器剪切复制插件、扩展程序步骤：\n1、 将下载的XX.crx插件的扩展名改成.zip或者.rar并解压到文件夹XX；\n2、在扩展程序界面（chrome://extensions/或更多工具-扩展程序）右上方的开发者模式按钮打开；\n3、在左上方，点击“加载已解压的扩展程序”，选择第一步中的文件夹XX，即可安装。" },
            { date: "3.12", content: "POS销售整票抹零（分都抹掉），会体现在其中一个品种上，即原折扣不变，实收金额会少， 变的实际折扣更低。在同样折扣情况下，销售折价输入整数的情况下POS端销售会显示在销售情况里，线上销售不显示。线上销售除非销售折价中输入小数点后几位才能查出。比如输入85-85折扣，只会显示POS端四舍五入等于85折销售的，不会显示线上四舍五入85折销售的，只能输入85.001-85.999才可查询出。" },
            { date: "4.18", content: "清除DNS缓存在Windows系统中，可以在命令提示符下使用“ipconfig /flushdns”命令来清除DNS缓存。" },
            { date: "4.23", content: "WIN11新电脑激活时候需要联网，否则不能进行下一步。可以按住“SHIFT+F10”,在对话框输入“oobe\\bypassnro.cmd”,重启后即可继续安装，且不需要账户登陆。" },
            { date: "4.24", content: "如果本机自动获取的IP出现网络冲突，可以开始运行CMD命令提示符，输入“ipconfig /release”,释放全部适配器由DHCP分配的动态IP地址。再输入“ipconfig /renew”重新分配IP地址。" },
            { date: "4.29", content: "当网络打印机某电脑找不到的时候，可能是IP4协议属性下的高级选项没有勾选MMHOSTS,并将一般默认的改为打勾启用TDP/IP上的NERBIOS即可。" },
            { date: "5.6", content: "文档中查找回车键想替换时，可以使用^p，即按住shift+6,再按p。视同回车键。" },
            { date: "6.6", content: "ERP系统切换\n2016.4.6-2016.4.11土右切换系统\n2016.4.18-2016.4.22达茂切换系统\n2016.5.9-2016.5.13固阳切换系统" },
            { date: "8.8", content: "教材转零售操作说明 \n注意：教材转门店，一个门店只可以设置一个，设置多个数据会出错。\n一、先设置地区：系统设置——地区档案设置。\n二、建立学校：系统设置——学校档案。\n注意事项：1、地区选上一步骤设置好的地区，在是否为门市复选框打勾。\n三、门市字典维护：系统设置——门市字典维护。注意事项：编号一定写成一般图书店号（例如通辽市店152017）。\n四、门市数据转出 ：库存管理——门市数据转出。   选择门市 库房 扫书号（或期号）、数量 最后店确认，\n五、接收数据：登录连锁店系统：到货管理——教材转入。选择转入条件，点击接收数据，核对后点击确认转入。\n六、教材转出：连锁店系统：物流管理——教材品种转出，根据接收数据，按照转出数，转回教材店。\n七、门市数据转入：教材店：库存管理——门市数据转入，一般图书数据回传数据，教材店进入此模块接收。" },
            { date: "8.8", content: "批销 \n卖场需做批销时，可在【批销管理】中【批销开单】，但必须是具有开单权限的人员开单。\n	书城一般选择整单折扣（系统内即各店批销折扣为70）\n	在购货单位选择好客户\n	逐本录入书号或整单提取单据进行批销\n	确认后交款金额一般为零(一般情况没有当时就付款的)，不需打印单据贴头\n	针对系统内单据必须是在【打印批销单据】里打印出的【标准格式明细1】即“包头新华书店发货单”，系统外可依据实际情况选择格式打印。\n	书城卖场人员在做本卖场批销时，注意必须选择正确的折扣方式，一般选择整单折扣。如果勾选一书一折，则批销的折扣=发货折扣+上浮折扣(本店系统内没有设上浮折扣)，也就意味没有利润产生；如果勾选的是整单折扣，则批销的折扣=客户档案中定义的固定折扣(系统内客户统一设置为70%)。" },
            { date: "8.8", content: "调整货位\n	可分为货位调整（日常）和货位调整（批量）两种。\n	货位调整（日常）中如需跨区调整，先选择调整库房后必须勾选【是否录入调入货区】方能选择调入货区。选择好调入货位填入调入货位数后点击【调整确认】。\n	货位调整（批量）是把一个货位的全部书目批量调整到另外一个货位上，如果被调整的货位上的书目在相同货区有多货位品种，该品种必须在该货区批量调整前调整到一个货位上。" },
            { date: "8.8", content: "主动下架 \n	当卖场人员根据不同实际情况，需要自主退货的，可持RF终端选择主动下架，输入箱号后回车，在弹出的界面输入要退货的货源(由于不能汉字输入，可筛选货源也可在PC端事先查询好货源编号输入。)点击确认后扫描每种图书输入数量再回车，下满一箱(也可品种少时多箱占用一个箱号)点击确认。\n下架注意事项 \n	卖场RF下架时，当某种书在该库房有多货位时，会在货位信息栏后出现三个小点，点击可以查看该书的具体货位库存情况。(打开的可视界面只显示一条货位信息)\n	卖场RF下架时，如遇按任务要求实在找不到所要下架的书目时，可以点击【跳过】并继续下一种书目的查找。\n1、在未确认此预退批次前如果又找到了此前跳过的书目，这时候可以点击【重新定位】按键扫描该书号后重新执行下架操作。\n2、如果已经确认生成预退批次，在15日内找到该书且退货库没有发运该书货源的退货，可以继续在任务里执行下架操作。\n	卖场RF下架时，如遇按任务要求实在找不到所要下架的书目时，可以直接在下架栏里输入0并回车，此时该书目默认已经下架且数量为零。\n1、在未确认此预退批次前如果又找到了该书，这时候可以点击【修改】按键扫描该书号后重新执行下架操作。\n2、如果已经确认生成预退批次，但又找到了之前下架数为零该书，此时该书只能改为主动下架。" },
            { date: "8.8", content: "按任务下架 \n	当业务员下达退货任务后，卖场营业员持RF进入每个货区对应的RF号，点击按任务下架并输入下架的箱号后回车，选择要做的任务批次后，对应RF枪界面上的书目信息输入下架册数，如有未找到的书目可按“跳过”继续下一书目的操作，对于预退实物数小于任务数的可先置实际数，此界面有“修改”和“重新定位”按键。\n	当一箱装满后可点击RF枪上的确认键完成该预退批次下架，如任务未完成可继续输入另一箱号按RF枪上的回车键，再次选取这个下架任务批次继续执行下架预退操作(注意任务批次和预退批次的区别)，直至该任务批次完成。\n	如果按任务下架的数量大于等于1即不为零，且回车后确认此预退批次，那么在执行此下架任务未完成的下架书目时，该下架品种则不会再出现，但是当找到在此下架任务剩下未预退的书目时，可以在同一下架任务的另一下架批次中选择修改或重新定位按钮来修改该品种的下架数量。\n	注意：一个下架任务批次可以有多个预退批次。" },
            { date: "8.8", content: "到货上架 \n	在接收物流送货后，每个营业员(相对应自己的货区)依据每箱的箱单号对照RF枪的上架任务输入箱号，逐一扫描书目录入相应数量、货位等信息。\n	注意：如有上架时数量与实际数量有差异，默认上架方损益。此时先按任务数上架并记录此书目信息。确实收货数量有差异可写“查询单”后由经理签字转交给物流待查。" },
            { date: "5.8", content: "东集RF配置如下：\n1、开关机设备上方红色按钮，长按开关机，短按为休眠。\n2、桌面应用管理器，输入密码seuic后，勾选一维和二维扫描。管理员界面下显示出的二维码双击后，选择设置并选择EAN-18和EAN-13；CODE128和CODE39，设置最小化，自动开机。选择文件，保存设置。\n3、控制面板中热键设置F1为业务系统，F3为盘点系统。\n4、点击左下角选择设置选择任务栏选择任务栏自动隐藏。\n5、桌面应用管理器快捷方式剪切到C盘里。\n6、控制面板显示中背景光分别设为5和10分钟。\n7、控制面板中电源中，电源电池方案分别设置为5；10；10分钟。\n8、更改日期时间" },
            { date: "6.6", content: "安装网址如下：\n连锁店正式地址：http://lsd.nmgxhsd.cn/centrinerp/centrinerp.htm\nCMS后台：http://cms.yhsms.com.cn/UserLogin.html\n书屋管理系统：https://cysw.nmgxhsd.cn:9000/centrincysw/centrincysw.htm\n基层店教材http://jcdjc.nmgxhsd.cn/jgerp/publish.htm\nNC系统：http://111.57.0.138:9080/portal/\n财务报表新系统http://111.57.0.138:9080\n盘点服务器：http://lsdpd.nmgxhsd.cn/lsdpd/zjpd.htm\n门户网站：http://111.57.0.140:8080/DreamWeb/\nPOS销售正式地址：http://lsdpos.nmgxhsd.cn/posmain/pos.htm" },
            { date: "8.20", content: "抖音本地生活读者85折买的100元书券，款台按原价销售，财务做账处理，其中有平台服务费扣除以及15元的费用，其他为实际销售收入。不可做折扣处理。" },
            { date: "9.05", content: "新的安装谷歌浏览器剪切复制插件、扩展程序步骤：\n1、 将下载的XX.crx插件的扩展名改成.zip或者.rar。解压到同一路径同名文件。\n2、在扩展程序界面（chrome://extensions/或更多工具-扩展程序）右上方的开发者模式按钮打开；\n3、直接拖入压缩文件即可，\n4、需要更改同名解压文件下的manifest.json里的manifest_version:2改为manifest_version:3，\n5、为什么拖入压缩文件，更改解压后的文件还可用？？" },
            { date: "5.06", content: "在 Excel 中将未填写的空白单元格标记为黄色，推荐使用‌条件格式‌功能，可实现输入内容后颜色自动消失的动态效果。\n条件格式自动标记（推荐）\n此方法设置后，单元格为空时显示黄色，填入数据后颜色自动取消，适合长期使用的表格。\n‌选中区域‌：鼠标选中需要设置的数据区域 。‌‌‌\n‌新建规则‌：点击【开始】选项卡下的【条件格式】，选择【新建规则】。‌‌‌\n‌设置条件‌：选择“只为包含以下内容的单元格设置格式”，在下拉菜单中选择‌空值‌。‌‌‌\n‌设置格式‌：点击【格式】按钮，在【填充】选项卡中选择‌黄色‌，连续点击确定保存 。‌" },
            { date: "7.10", content: "财务推凭销项税按类别区分税率，进项税按发票上的税率。但是都和发行卡里的税率没有关系，发行卡的税率是书目库的税率是第一次录入时候单头填的税率。" }

        const searchInput = document.getElementById('searchInput');
        const logList = document.getElementById('logList');
        const noResults = document.getElementById('noResults');

        // 核心逻辑：初始隐藏，输入后显示
        searchInput.addEventListener('input', function() {
            const keyword = this.value.trim().toLowerCase();
            
            // 1. 如果搜索框为空，隐藏所有内容
            if (!keyword) {
                logList.innerHTML = '';
                noResults.style.display = 'none';
                return;
            }

            // 2. 过滤数据
            const filteredLogs = logs.filter(log => 
                log.content.toLowerCase().includes(keyword) || 
                log.date.toLowerCase().includes(keyword)
            );

            // 3. 渲染结果
            if (filteredLogs.length > 0) {
                noResults.style.display = 'none';
                logList.innerHTML = filteredLogs.map(log => {
                    // 高亮关键词逻辑
                    const regex = new RegExp(`(${keyword})`, 'gi');
                    const highlightedContent = log.content.replace(regex, '<span class="highlight">$1</span>');
                    const highlightedDate = log.date.replace(regex, '<span class="highlight">$1</span>');

                    return `
                        <li class="log-item">
                            ${log.date ? `<span class="log-date">${highlightedDate}</span>` : ''}
                            <div class="log-content">${highlightedContent}</div>
                        </li>
                    `;
                }).join('');
            } else {
                logList.innerHTML = '';
                noResults.style.display = 'block';
            }
        });
    </script>
